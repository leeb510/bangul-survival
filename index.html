<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3fb4e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<title>방울섬 서바이벌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed canvas field with sticker HUD; one floating joystick anywhere, dash button bottom-right; menus are centered sticker panels */
:root{
  --sea:#3fb4e0;
  --ink:#3a2e5f;
  --paper:#fffdf8;
  --pink:#ff6f9f;
  --mint:#4fd1b5;
  --sun:#ffd166;
  --soft:#5b5080;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--sea);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
body{word-break:keep-all;font-family:var(--font-body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;touch-action:none;overflow:hidden;background:var(--sea)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#safeProbe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#touchZone{position:absolute;inset:0}

#pad{position:absolute;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:none}
body.touch #pad{display:block}
body.menu #pad,body.menu #topBtns{display:none}
.pbtn{width:78px;height:78px;border:3px solid var(--ink);border-radius:50%;background:var(--mint);font-family:var(--font-display);font-size:18px;color:var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;touch-action:none;cursor:pointer;padding:0;transition:opacity .15s}
.pbtn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pbtn.cool{opacity:.45}

#topBtns{position:absolute;top:calc(env(safe-area-inset-top,0px) + 30px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ibtn svg{width:20px;height:20px;display:block}
.ibtn.spd{width:50px;font-family:var(--font-display);font-size:16px;font-variant-numeric:tabular-nums}
.ibtn.spd.fast{background:var(--sun)}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.seg button{font-family:var(--font-display);font-size:15px;border:0;border-left:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--sun)}
.seglabel{font-family:var(--font-display);font-size:15px}
.card.evo{background:#fff3c4}
.card .ct.evo{background:var(--sun)}
.card .hint2{font-size:12px;color:var(--soft)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;width:100%}
.recipe{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff}
.recipe.got{background:#fff3c4}
.formula{display:flex;align-items:center;gap:2px;font-family:var(--font-display);font-size:15px}
.formula canvas{width:30px;height:30px}
.recipe .rn{font-family:var(--font-display);font-size:16px}
.recipe .rd{grid-column:1/-1;font-size:13px;color:var(--soft);line-height:1.4}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--font-display);font-size:17px;padding:8px 18px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;animation:pop .35s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.screen{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;overflow:auto;background:rgba(58,46,95,.45);padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;touch-action:auto}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:18px 22px;max-width:640px;width:100%;box-sizing:border-box;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.panel.narrow{max-width:460px}
.art{flex:0 0 auto;width:120px;height:120px;max-width:100%;border-radius:50%;background:#b8ecf7;border:3px solid var(--ink)}
.herocol{flex:0 0 auto;margin-inline:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.vilbtn{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-display);font-size:14px;background:#ffd6e8;color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:3px 12px 3px 8px;cursor:pointer}
.vilbtn svg{width:20px;height:20px}
.vilbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.charbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.charbtn .cname{font-family:var(--font-display);font-size:18px}
.charbtn small,.chcard small{font-family:var(--font-body);font-size:12px;color:var(--soft)}
.charbtn .chg{font-family:var(--font-display);font-size:13px;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;box-shadow:0 2px 0 var(--ink)}
.charbtn:active .art{transform:scale(.97)}
.chars{max-width:100%;min-width:0;display:flex;gap:7px;overflow-x:auto;padding:4px 4px 8px;scroll-snap-type:x proximity;touch-action:pan-x;scrollbar-width:thin}
.chars .chcard{flex:0 0 132px;scroll-snap-align:start}
.picwrap{position:relative;display:block}
.chcard.locked .chpic{filter:grayscale(.75) brightness(.92)}
.chcard.locked{background:#f4f1fb}

.lockbadge{position:absolute;right:-4px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--sun);display:grid;place-items:center}
.lockbadge svg{width:15px;height:15px}
.unlock{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:3px;font-family:var(--font-display);font-size:13px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;line-height:1.2;white-space:nowrap;min-height:26px;box-sizing:border-box}
.unlock canvas{width:18px;height:18px}
.chpas{display:flex;flex-direction:column;align-items:center;gap:2px;background:#eef9f5;border:2px dashed #7fcfb5;border-radius:10px;padding:3px 5px;width:100%;box-sizing:border-box}
.chpl{font-family:var(--font-display);font-size:11px;color:#2f8f72}
.chpi{display:flex;flex-direction:column;align-items:flex-start;gap:1px;font-size:11px}
.chpi span{display:inline-flex;align-items:center;gap:2px}
.chpi canvas{width:16px;height:16px}
.unlock.ask{background:var(--pink)}
.unlock.short{background:#fff;color:#c2416f}
.chcard{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:9px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--ink);font-family:var(--font-body);min-width:0}
.chcard.sel{background:#fff3c4;outline:3px solid var(--pink);outline-offset:2px}
.chpic{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--ink)}
.chn{font-family:var(--font-display);font-size:18px}
.chw .sig{font-weight:400;font-size:11px;background:#e6f7f0;color:#2f8f72;border-radius:6px;padding:0 4px;margin-left:2px}
.chw{display:flex;align-items:center;gap:3px;font-size:12px;white-space:nowrap;font-family:var(--font-display)}
.chw canvas{width:22px;height:22px}
.cht{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;line-height:1.35;text-align:center}
.cht .neg{color:#c2416f}
.cht .pos{color:#2f8f72;white-space:nowrap;font-size:11px}
.txt{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px}
.eyebrow{margin:0;font-family:var(--font-display);font-size:13px;letter-spacing:.08em;color:var(--pink)}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(30px,5.6vw,44px)}
h1 span{color:var(--pink)}
h2{font-size:clamp(24px,4.4vw,32px)}
.lead{margin:0;font-size:15px;line-height:1.5;color:var(--soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--font-display);font-size:20px;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 22px;cursor:pointer}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.big.alt{background:var(--paper);font-size:17px}
.minibtn{font-family:var(--font-display);font-size:14px;background:var(--mint);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:3px 12px;cursor:pointer}
.minibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.minibtn.gear{display:inline-flex;align-items:center;gap:4px;background:var(--paper)}
.minibtn.gear svg{width:15px;height:15px}
.credit{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-family:var(--font-display);font-size:13px;color:#fffdf8;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink);pointer-events:none;letter-spacing:.03em}
.setcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.setcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.setgrp{display:flex;flex-direction:column;gap:8px;border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;background:#fff}
.sethead{margin:0;font-family:var(--font-display);font-size:14px;color:var(--pink);letter-spacing:.06em}
.setrow{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px}
.setrow label,.setrow .lab{font-family:var(--font-display);font-size:16px}
.setrow .seg,.setrow .toggle{grid-column:2 / 4;justify-self:start}
.setrow input[type=range]{width:100%;min-width:0;accent-color:var(--pink);touch-action:auto;height:28px}
.setrow output{font-family:var(--font-display);font-size:15px;min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
.toggle{font-family:var(--font-display);font-size:15px;border:2.5px solid var(--ink);border-radius:999px;padding:3px 16px;cursor:pointer;color:var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink)}
.toggle[aria-pressed="true"]{background:var(--mint)}
.big.warn{background:var(--pink)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.candy{font-family:var(--font-display);font-size:16px;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.candy canvas{width:22px;height:22px}

.stages{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.stages .stage{flex:0 0 96px;scroll-snap-align:start}
.stage .sn{font-size:11px;color:var(--soft);font-family:var(--font-body)}
.stage{font-family:var(--font-display);font-size:15px;white-space:nowrap;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:6px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.stage .sw{width:100%;height:10px;border-radius:6px;border:2px solid var(--ink);box-sizing:border-box}
.stage .ss{font-family:var(--font-body);font-size:12px;color:var(--soft)}
.stage.sel{background:var(--sun)}
.modeseg{box-shadow:0 2px 0 var(--ink);border-width:2px;border-radius:10px}
.modeseg button{font-size:13px;padding:2px 10px;display:inline-flex;align-items:center;gap:3px}
.modeseg button svg{width:11px;height:11px}
.modeseg #mHard[aria-pressed="true"]{background:#ff7a8a;color:#fff}
.modeseg #mHard.locked{color:#9a93b5}
.stage.hard{border-color:#8a2340;box-shadow:0 3px 0 #8a2340}
.stage.hard .sn{color:#c2416f;font-family:var(--font-display)}
.stage.hard.sel{background:#ffb3bd}
.stage.chal{border-color:#7a2f5a;box-shadow:0 3px 0 #7a2f5a;background:#fff0f4}
.stage.chal .sn{color:#c2416f;font-family:var(--font-display)}
.stage.chal.sel{background:#ffb8cc}
.chdiv{flex:0 0 auto;align-self:center;writing-mode:vertical-rl;font-family:var(--font-display);font-size:12px;color:#fff;background:#c2416f;border-radius:8px;padding:6px 3px;letter-spacing:.1em}
.rulechips{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-right:4px}
.rulechips span{font-family:var(--font-display);font-size:12px;background:#ffe0ea;color:#a3335c;border:1.5px solid #c2416f;border-radius:999px;padding:0 7px}
.stage:disabled{opacity:.45;cursor:default}
.hint{font-size:13px;color:var(--soft);margin:0}

.lvl{max-width:760px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.lvl h2{color:var(--paper);-webkit-text-stroke:0;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.bag{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:7px 12px 5px;width:100%;box-sizing:border-box}
.grp{display:flex;align-items:flex-start;gap:4px;flex-wrap:wrap;justify-content:center}
.gl{font-family:var(--font-display);font-size:13px;color:var(--soft);align-self:center;margin-right:4px;white-space:nowrap}
.slot{width:58px;display:flex;flex-direction:column;align-items:center;gap:3px}
.sic{position:relative;width:34px;height:34px;border:2px solid var(--ink);border-radius:9px;background:#fff;display:grid;place-items:center;box-sizing:border-box}
.sic canvas{width:28px;height:28px}
.slot.evo .sic{background:#fff3c4}
.slot.up .sic{outline:3px solid var(--pink);outline-offset:1px}
.slot.empty .sic{border-style:dashed;opacity:.45;background:transparent}
.lv{position:absolute;right:-9px;bottom:-6px;font-family:var(--font-display);font-size:10px;background:var(--mint);border:1.5px solid var(--ink);border-radius:999px;padding:0 4px;line-height:1.35;white-space:nowrap}
.slot.evo .lv{background:var(--sun)}
.sn2{font-size:11px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.empty .sn2{color:var(--soft)}
.lvl h2{font-size:clamp(22px,4vw,28px)}
.lvlhead{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.reroll{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:4px 14px 4px 8px;cursor:pointer}
.reroll canvas{width:22px;height:22px}
.reroll .rc{background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:0 7px;font-size:13px}
.reroll .key{font-size:11px;color:var(--soft)}
body.touch .reroll .key{display:none}
.reroll:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.reroll:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
@media (max-width:540px){.cards{grid-template-columns:1fr}}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:12px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;cursor:pointer;font-family:var(--font-body);color:var(--ink);min-width:0}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.card canvas{width:48px;height:48px}
.card .cn{font-family:var(--font-display);font-size:19px}
.card .ct{font-family:var(--font-display);font-size:13px;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.card .ct.new{background:var(--pink)}
.card .cd{font-size:14px;line-height:1.45}
.card .key{font-size:12px;color:var(--soft)}
body.touch .card .key{display:none}
@media (max-width:540px){.card{flex-direction:row;text-align:left;align-items:center}.card .cbody{align-items:flex-start}}
.cbody{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}

.chcard.rand .randw{font-family:var(--font-display);font-size:13px;color:var(--soft)}
.helpov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(58,46,95,.5);padding:16px;animation:helpfade .15s ease-out}
.helpbox{width:min(100%,340px);background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.helpbox h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--pink)}
.helpmsg{margin:0;width:100%;box-sizing:border-box;padding:10px 14px;font-family:var(--font-display);font-size:20px;text-align:center}
@keyframes helpfade{from{opacity:0}}
.screen.vilmode{padding:0;background:#7fd3ff;place-items:stretch;overflow:hidden}
.vil{position:relative;width:100%;height:100%;min-height:0;overflow:hidden}
#vcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.vtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(255,253,248,.95),rgba(255,253,248,.85));border-bottom:3px solid var(--ink);z-index:2}
.vtop h2{margin:0;font-size:22px;flex:1 1 auto;white-space:nowrap}
.vsize{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:70px;z-index:2;font-family:var(--font-display);font-size:13px;color:#6b5a9e;background:rgba(255,253,248,.92);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;pointer-events:none;max-width:calc(100% - 90px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .big{font-size:15px;padding:4px 12px}
.vtabs button{font-size:15px;padding:4px 14px}
.vmsg{position:absolute;left:50%;top:70px;transform:translateX(-50%);margin:0;z-index:4;background:var(--ink);color:#fff;font-family:var(--font-display);font-size:15px;padding:6px 14px;border-radius:999px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.vzoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:76px;display:flex;flex-direction:column;gap:6px;z-index:2}
.vzoom button{width:34px;height:34px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);font-size:20px;font-weight:700;color:var(--ink);cursor:pointer}
.vact{flex:1 0 100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:#fff3f8;border:2px solid var(--ink);border-radius:14px;padding:4px 10px;font-family:var(--font-display);font-size:14px;box-sizing:border-box}

let ac = null, master = null;

      master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
      musicBus = ac.createGain(); musicBus.connect(master);
      sfxBus = ac.createGain(); sfxBus.connect(master);

    } catch(e){ ac = null; }
  }

}
let musicBus = null, sfxBus = null;
function applyAudio(){
  if (!ac) return;

  sfxBus.gain.value = curve(settings.sfx);
}

function tone(f, f2, dur, type, vol, delay = 0, bus = 'sfx'){

  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();

  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);

}

function sfx(n, gap = 0){
  const now = performance.now();

  lastSfx[n] = now;
  switch (n){
    case 'shoot': tone(900, 1500, .07, 'sine', .035); break;
    case 'swing': tone(760, 320, .12, 'triangle', .1); break;
    case 'hit': tone(240, 120, .07, 'square', .05); break;
    case 'pop': tone(520, 1200, .1, 'sine', .08); break;
    case 'gem': tone(midi(84 + Math.min(14, G ? G.combo : 0)), 0, .07, 'sine', .06); break;
    case 'heart': tone(659, 0, .1, 'sine', .14); tone(988, 0, .16, 'sine', .14, .09); break;
    case 'hurt': tone(320, 120, .22, 'sawtooth', .08); break;

    case 'boom': tone(180, 60, .25, 'triangle', .16); break;
    case 'chest': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .18, 'triangle', .14, i * .08)); break;
    case 'level': [659, 784, 988, 1319].forEach((f, i) => tone(f, 0, .2, 'sine', .13, i * .07)); break;
    case 'warn': tone(220, 0, .3, 'square', .07); tone(196, 0, .4, 'square', .07, .32); break;
    case 'win': [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0, .3, 'triangle', .13, i * .13)); break;

/* ---------- spatial grid ---------- */
const grid = new Map();
const gkey = (cx, cy) => (cx + 50000) * 100000 + (cy + 50000);
function buildGrid(){
  grid.clear();
  for (const e of G.enemies){
    if (e.dead) continue;
    const k = gkey(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
    let a = grid.get(k); if (!a){ a = []; grid.set(k, a); } a.push(e);
  }
}
function query(x, y, r, cb){
  const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL), y0 = Math.floor((y - r) / CELL), y1 = Math.floor((y + r) / CELL);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++){
    const a = grid.get(gkey(cx, cy)); if (!a) continue;
    for (const e of a) if (!e.dead) cb(e);
  }
}

/* ---------- effects ---------- */
function burst(x, y, col, n, opt = {}){
  if (G.parts.length > 380) n = Math.min(n, 3);
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU, s = (opt.speed || 90) * (.5 + Math.random());
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (opt.up || 30), life: .4 + Math.random() * .4, max: .8,
      col: Array.isArray(col) ? col[i % col.length] : col, size: 2 + Math.random() * 2.6, g: opt.g ?? 240, type: Math.random() < .35 ? 'star' : 'dot' });
  }
}
function addText(x, y, txt, col = '#ffffff', big = false){
  if (G.texts.length > 45) G.texts.shift();
  G.texts.push({ x, y, txt, col, big, life: big ? .75 : .6 });
}
let toastT = 0;
function toast(text){ toastT = 2.6; const el = $('toast'); el.textContent = text; el.hidden = false; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }

/* ---------- gameplay ---------- */
function spawnPos(extra = 24){ const R = Math.hypot(vw, vh) / zoom / 2 + extra, a = Math.random() * TAU; return [G.p.x + Math.cos(a) * R, G.p.y + Math.sin(a) * R]; }
function pickKind(){
  const list = G.st.spawns.filter(s => G.time >= s[1]);
  let tot = 0; for (const s of list) tot += s[2];
  let r = Math.random() * tot;
  for (const s of list){ r -= s[2]; if (r <= 0) return s[0]; }
  return list[0][0];
}
function makeEnemy(kind, x, y, opt = {}){
  const d = EN[kind], tm = 1 + G.time / 60 * (G.st.grow || .32), s = opt.s || 1;
  // 7분이 지나면 몬스터 체력 ×1.3, 10분이 지나면 ×1.7 (중간 보스·최종 보스는 제외)
  const late = G.time >= 600 ? 1.7 : G.time >= 420 ? 1.3 : 1;
  const hp = opt.hp || d.hp * G.st.hpMul * tm * late;
  return { kind, x, y, hp, max:hp, s, r:d.r * s, fly:!!d.fly, xp:d.xp,
    spd: d.spd * .63 * (opt.spdMul || 1) * (G.st.spdMul || 1) * (1 + Math.min(G.time, BOSS_AT) / BOSS_AT * .25),
    dmg: Math.round(d.dmg * (1 + Math.min(G.time, BOSS_AT) / BOSS_AT * .6) * (opt.dmgMul || 1) * (G.st.dmgMul || 1)),
    ph: Math.random() * TAU, z:0, kx:0, ky:0, hurt:0, dead:false, col:(opt.boss && G.st.bossCol) || G.st.slime, elite:!!opt.elite, boss:!!opt.boss, petalT:0, slowT:0, slowMul:1, walk:0, look:1 };
}
function spawnTick(dt){
  const t = G.time;
  if (G.boss && G.boss.dead) return;
  const rate = Math.min(13, 1.6 + t / 24) * (G.st.rateMul || 1) * (G.boss ? .45 : 1);
  G.spawnAcc += rate * dt;
  while (G.spawnAcc >= 1){
    G.spawnAcc--;
    if (G.enemies.length < 280){ const [x, y] = spawnPos(); G.enemies.push(makeEnemy(pickKind(), x, y)); }
  }
  const ELITE_AT = [150, 300, 450, 600, 750], ELITE_HP = [.5, .6, .7, .8, .9]; // 중간 보스: 처음 50%, 나올 때마다 10%씩 늘어나요
  for (const [ei, et] of ELITE_AT.entries()) if (t >= et && !G.events['e' + et]){
    G.events['e' + et] = 1;
    const [x, y] = spawnPos();
    G.enemies.push(makeEnemy(G.st.boss, x, y, { s:2, hp:420 * G.st.hpMul * (1 + t / 60 * (G.st.grow || .32)) * ELITE_HP[ei], elite:true, spdMul:.95, dmgMul:1.6 }));
    toast('커다란 ' + EN[G.st.boss].subj + ' 다가와요! 쓰러뜨리면 보물상자');
  }
  for (const et of [95, 255, 405, 525, 675, 825]) if (t >= et && !G.events['s' + et]){
    G.events['s' + et] = 1;
    const n = 22, R = Math.hypot(vw, vh) / zoom / 2 * .85;
    const sk = G.st.swarm || 'bee';
    for (let i = 0; i < n; i++){ const a = i / n * TAU; G.enemies.push(makeEnemy(sk, G.p.x + Math.cos(a) * R, G.p.y + Math.sin(a) * R, { spdMul:1.1 })); }
    toast(`${EN[sk].crowd}가 둘러쌌어요!`);
  }
  if (t >= BOSS_AT && !G.events.boss){
    G.events.boss = 1;
    const [x, y] = spawnPos();
    G.boss = makeEnemy(G.st.boss, x, y, { s:3.2, hp:6000 * 1.3 * G.st.hpMul, boss:true, spdMul:1.05, dmgMul:2.4 });
    G.bossAt = G.time;
    G.enemies.push(G.boss); toast(G.st.bossMsg); sfx('warn'); G.shake = .3;
  }
}
function hurtPlayer(dmg){
  const p = G.p;
  if (S.dodge && Math.random() < S.dodge){ p.inv = .35; addText(p.x, p.y - 30, '휙!', '#9fdcff', true); return; }
  dmg = Math.max(1, Math.round(dmg * (1 - S.armor)));
  G.hitOnce = true;
  p.hp -= dmg; p.inv = .45; G.shake = Math.max(G.shake, .12); sfx('hurt');
  addText(p.x, p.y - 30, dmg, '#ff6f9f');
  if (p.hp <= 0 && G.revives > 0){
    G.revives--; G.reviveUsed = true; p.hp = p.maxHp; p.inv = 2.5; G.shake = .3;
    for (const e of G.enemies){
      if (e.dead || e.boss) continue;
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1;
      if (d < 180){ e.kx += dx / d * 520; e.ky += dy / d * 520; }
    }
    burst(p.x, p.y - 14, ['#ff5d7a', '#ffffff', '#ffd166', '#ff8fc5'], 50, { speed:220, up:120 });
    G.fx.push({ k:'boom', x:p.x, y:p.y, r:180, life:.45, max:.45 });
    sfx('win'); toast('날개 하트 발동! 다시 일어났어요');
    addText(p.x, p.y - 40, '부활!', '#ff8fc5', true);
    return;
  }
  if (p.hp <= 0){ p.hp = 0; state = 'dying'; G.dieT = 1.3; releaseJoy(); keys.clear(); burst(p.x, p.y - 12, ['#5ad6b8', '#fff', '#ff8fc5'], 30, { speed:160 }); sfx('lose'); }
}
function damage(e, base, nx, ny, kb, forceCrit){
  if (e.dead) return;
  const crit = forceCrit || Math.random() < S.crit;
  const d = Math.max(1, Math.round(base * S.power * (.9 + Math.random() * .2) * (crit ? 2 : 1)));
  e.hp -= d; e.hurt = .12;
  const k = e.boss ? 0 : e.elite ? .2 : 1;
  e.kx += nx * kb * 130 * k; e.ky += ny * kb * 130 * k;
  if (crit) addText(e.x + (Math.random() - .5) * 10, e.y - e.r * 1.7 - e.z - 4, d + '!', '#ffd166', true);
  else addText(e.x + (Math.random() - .5) * 10, e.y - e.r * 1.7 - e.z, d);
  if (e.hp <= 0) kill(e); else sfx('hit', 70);
}
function kill(e){
  e.dead = true; G.kills++; meta.stats.kills++;
  const col = e.kind === 'bee' ? '#ffd23f' : e.kind === 'crab' ? '#ff7d5c' : e.kind === 'mushroom' ? '#ff6b6b' : e.kind === 'penguin' ? '#3d4f86' : e.kind === 'ghost' ? '#ece7ff' : e.col;
  burst(e.x, e.y - e.r, [col, '#fff'], e.boss ? 70 : e.elite ? 26 : 6, { speed: e.boss ? 240 : e.elite ? 150 : 90 });
  sfx('pop', 60);
  if (e.boss){
    G.bossLowHp = G.p.hp > 0 && G.p.hp <= G.p.maxHp * .1; G.bossFast = !!G.st.hard && G.time - (G.bossAt || 0) <= 60;
    G.clearT = 2.4; G.coins += 50; sfx('win'); G.shake = .4;
    for (const o of G.enemies) if (!o.dead){ o.dead = true; burst(o.x, o.y - o.r, ['#fff', '#ffd166'], 3); }
    for (const g of G.gems) g.m = true;
    toast('해냈어요! 섬에 평화가 돌아왔어요');
    return;
  }
  if (e.elite){ meta.stats.mid++; G.items.push({ k:'chest', x:e.x, y:e.y, z:10, vz:200, age:0 }); G.coins += 5; return; }
  dropGem(e.x, e.y, e.xp);
  if (Math.random() < .025) G.items.push({ k:'candy', x:e.x + 8, y:e.y, z:4, vz:150, age:0 });
}
function dropGem(x, y, v){
  if (G.gems.length > 320){ G.gems[(Math.random() * G.gems.length) | 0].v += v; return; }
  G.gems.push({ x, y, v, m:false, sp:0 });
}


/* ---------- 하드 모드 장애물 (바위 · 큰 바위 · 벽) ---------- */
// 하드 1~5단계: 작은 바위 / 6~10단계: 돌아가야 하는 큰 바위 / 11~15단계: 길을 막는 벽
const OCH = 400;
let OB = { tier:0, seed:0, map:new Map() };
const OBS_TEXT = ['', '군데군데 바위가 놓여 있어요.', '돌아서 가야 하는 큰 바위가 있어요.', '길을 막는 벽이 곳곳에 있어요.'];
const obsTierOf = i => i < 5 ? 1 : i < 10 ? 2 : 3;
function mkRng(a){ return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function obsReset(){ OB = { tier: G.st.hard ? obsTierOf(G.stage) : 0, seed: G.stage * 31 + 7, map: new Map() }; }
const obsExt = b => b.t === 'wall' ? [b.hw, b.hh] : [b.r, b.r * b.k];
function obsChunk(cx, cy){
  const key = gkey(cx, cy); let a = OB.map.get(key); if (a) return a;
  a = []; OB.map.set(key, a);
  const R = mkRng((cx * 73856093) ^ (cy * 19349663) ^ (OB.seed * 83492791)), x0 = cx * OCH, y0 = cy * OCH, M = 30, GAP = 58;
  const place = o => {
    const [hw, hh] = obsExt(o);
    for (let n = 0; n < 10; n++){
      o.x = x0 + M + hw + R() * (OCH - 2 * M - 2 * hw); o.y = y0 + M + hh + R() * (OCH - 2 * M - 2 * hh);
      if (Math.abs(o.x) < 190 + hw && Math.abs(o.y) < 170 + hh) continue; // 시작 자리는 비워 둬요
      if (a.some(b => { const [bw, bh] = obsExt(b); return Math.abs(o.x - b.x) < hw + bw + GAP && Math.abs(o.y - b.y) < hh + bh + GAP; })) continue;
      o.v = R(); a.push(o); return;
    }
  };
  const rock = () => place({ t:'rock', r:13 + R() * 8, k:.72 });
  const boulder = () => place({ t:'boulder', r:46 + R() * 22, k:.66 });
  if (OB.tier === 1){ const n = 3 + (R() < .5 ? 1 : 0); for (let i = 0; i < n; i++) rock(); }
  else if (OB.tier === 2){ boulder(); if (R() < .55) boulder(); rock(); rock(); }
  else if (OB.tier === 3){
    const n = 1 + (R() < .55 ? 1 : 0);
    for (let i = 0; i < n; i++){ const L = 80 + R() * 62; place(R() < .5 ? { t:'wall', hw:L, hh:14 } : { t:'wall', hw:14, hh:L }); }
    if (R() < .6) boulder(); rock(); if (R() < .5) rock();
  }
  return a;
}
// 원(반지름 r)이 장애물과 겹치면 밖으로 밀어내요. 부딪힌 면의 방향을 돌려줘요.
function obsResolve(o, r){
  if (!OB.tier) return null;
  let hit = null;
  const cx0 = Math.floor((o.x - r) / OCH), cx1 = Math.floor((o.x + r) / OCH), cy0 = Math.floor((o.y - r) / OCH), cy1 = Math.floor((o.y + r) / OCH);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) for (const b of obsChunk(cx, cy)){
    if (b.t === 'wall'){
      const qx = Math.max(b.x - b.hw, Math.min(b.x + b.hw, o.x)), qy = Math.max(b.y - b.hh, Math.min(b.y + b.hh, o.y));
      const dx = o.x - qx, dy = o.y - qy, d = Math.hypot(dx, dy);
      if (d >= r) continue;
      if (d < .001){
        const px = b.hw - Math.abs(o.x - b.x), py = b.hh - Math.abs(o.y - b.y);
        if (px < py){ const sx = Math.sign(o.x - b.x) || 1; o.x = b.x + sx * (b.hw + r); hit = [sx, 0, b]; }
        else { const sy = Math.sign(o.y - b.y) || 1; o.y = b.y + sy * (b.hh + r); hit = [0, sy, b]; }
      } else { const nx = dx / d, ny = dy / d; o.x = qx + nx * r; o.y = qy + ny * r; hit = [nx, ny, b]; }
    } else {
      const dx = o.x - b.x, dy = (o.y - b.y) / b.k, d = Math.hypot(dx, dy), RR = b.r + r;
      if (d >= RR) continue;
      const nx = d > .001 ? dx / d : 0, ny = d > .001 ? dy / d : 1;
      o.x = b.x + nx * RR; o.y = b.y + ny * RR * b.k; hit = [nx, ny, b];
    }
  }
  return hit;
}
function obsInView(x0, y0, x1, y1, out){
  for (let cy = Math.floor(y0 / OCH); cy <= Math.floor(y1 / OCH); cy++) for (let cx = Math.floor(x0 / OCH); cx <= Math.floor(x1 / OCH); cx++) for (const b of obsChunk(cx, cy)) out.push(b);
  return out;
}
function updatePlayer(dt){
  const p = G.p, iv = inputVec();
  p.moving = iv.m > .12;
  if (p.moving){ const l = Math.hypot(iv.x, iv.y); p.fx = iv.x / l; p.fy = iv.y / l; p.walk += dt * (.4 + iv.m * .6); }
  if (wantDash){ wantDash = false; if (p.dashCd <= 0){ p.dashT = .18; p.dashCd = 2.2; p.inv = Math.max(p.inv, .32); sfx('dash'); } }
  let mx = iv.x * 100 * S.speed, my = iv.y * 100 * S.speed;
  if (p.dashT > 0){
    p.dashT -= dt; mx = p.fx * 380; my = p.fy * 380;
    G.parts.push({ x:p.x + (Math.random() - .5) * 8, y:p.y - 10, vx:0, vy:-10, life:.3, max:.3, col:'rgba(255,255,255,.9)', size:6, g:0, type:'dot' });
  }
  p.x += mx * dt; p.y += my * dt;
  if (OB.tier){ obsResolve(p, 8); obsResolve(p, 8); }
  p.dashCd -= dt; p.inv -= dt;
  if (S.regen && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + S.regen * dt);
  G.healTick += dt;
  if (G.healTick >= 20){ // 기본 회복: 20초마다 최대 체력의 1%
    G.healTick -= 20;
    if (p.hp < p.maxHp){ const amt = p.maxHp * .01 * healMul(); p.hp = Math.min(p.maxHp, p.hp + amt); addText(p.x, p.y - 34, '+' + (Math.round(amt * 10) / 10), '#7ee08a'); }
  }
}
function updateEnemies(dt){
  const p = G.p, farD = Math.hypot(vw, vh) / zoom * .95;
  for (const e of G.enemies){
    if (e.dead) continue;
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.hurt -= dt; e.ph += dt; e.slowT -= dt;
    if (e.dotT > 0){
      e.dotT -= dt; e.dotAcc = (e.dotAcc || 0) + dt;
      if (e.dotAcc >= .5){
        e.dotAcc -= .5; damage(e, e.dotDps * .5, 0, 0, 0);
        G.parts.push({ x:e.x + (Math.random() - .5) * e.r, y:e.y - e.r * 1.4 - e.z, vx:0, vy:-34, life:.5, max:.5, col:e.dotCol, size:3.2, g:0, type:'dot' });
        if (e.dead) continue;
      }
    }
    if (e.stunT > 0) e.stunT -= dt;
    let sp = e.spd * (e.slowT > 0 ? e.slowMul : 1);
    if (e.kind === 'slime'){ const h = Math.max(0, Math.sin(e.ph * 5.5)); sp *= .35 + h * 1.3; e.z = h * 7 * e.s; }
    else if (e.kind === 'bee') e.z = (12 + Math.sin(e.ph * 4) * 3) * e.s;
    else if (e.kind === 'ghost') e.z = (10 + Math.sin(e.ph * 3) * 4) * e.s;
    else if (e.kind === 'penguin'){ e.slide = (e.ph % 3.2) > 2.5; if (e.slide) sp *= 2.4; e.walk += dt * sp * .12; }
    else e.walk += dt * sp * .12;
    if (e.stunT > 0 && !e.boss) sp = 0;
    e.look = dx < 0 ? -1 : 1;
    let ux = dx / d, uy = dy / d;
    if (e.wps){
      // 벽을 돌아가는 길 (벽 끝 모서리 → 반대편 모서리)
      const w0 = e.wps[0];
      if (Math.hypot(w0.x - e.x, w0.y - e.y) < 12) e.wps.shift();
      if ((e.wpT -= dt) <= 0 || !e.wps.length || e.wpSide !== Math.sign(e.wpH ? p.y - e.wpB.y : p.x - e.wpB.x)) e.wps = null;
      else { const wx = e.wps[0].x - e.x, wy = e.wps[0].y - e.y, wl = Math.hypot(wx, wy) || 1; ux = wx / wl; uy = wy / wl; }
    }
    e.x += (ux * sp + e.kx) * dt; e.y += (uy * sp + e.ky) * dt;
    if (OB.tier && !e.fly && !e.boss){
      const n = obsResolve(e, e.r * .8);
      if (n){
        // 막히면 옆으로 미끄러지며 돌아서 와요 (한 번 고른 방향을 잠깐 유지)
        e.slideT = .7; e.slideLong = (e.slideLong || 0) + dt;
        const wb = n[2];
        if (wb.t === 'wall' && !e.wps && (wb.hw > wb.hh ? Math.abs(n[1]) > .7 : Math.abs(n[0]) > .7)){
          // 벽에 막히면 플레이어 쪽으로 더 가까운 벽 끝을 골라 모서리를 돌아서 와요
          const H = wb.hw > wb.hh, a0 = H ? wb.x - wb.hw : wb.y - wb.hh, a1 = H ? wb.x + wb.hw : wb.y + wb.hh, ea = H ? e.x : e.y, pa = H ? p.x : p.y;
          const lo = Math.abs(ea - a0) + Math.abs(pa - a0) < Math.abs(ea - a1) + Math.abs(pa - a1), m = e.r + 16;
          const ex = lo ? a0 - m : a1 + m, sd = Math.sign(H ? e.y - wb.y : e.x - wb.x) || 1, half = (H ? wb.hh : wb.hw) + m, c = H ? wb.y : wb.x;
          e.wps = H ? [{ x:ex, y:c + sd * half }, { x:ex, y:c - sd * half }] : [{ x:c + sd * half, y:ex }, { x:c - sd * half, y:ex }];
          e.wpB = wb; e.wpH = H; e.wpSide = -sd; e.wpT = 6; e.slideS = 0;
        } else if (e.slideLong > 2.4){ e.slideLong = 0; e.slideS = -(e.slideS || 1); } // 오래 막혀 있으면 반대쪽으로 돌아가요
        if (!e.slideS){ const tdot = -n[1] * dx + n[0] * dy; e.slideS = Math.abs(tdot) > d * .2 ? Math.sign(tdot) : (Math.random() < .5 ? -1 : 1); }
        e.x += -n[1] * e.slideS * sp * .95 * dt; e.y += n[0] * e.slideS * sp * .95 * dt;
        obsResolve(e, e.r * .8);
      } else if ((e.slideT = (e.slideT || 0) - dt) <= 0){ e.slideS = 0; e.slideLong = 0; }
    }
    const kd = Math.max(0, 1 - dt * 10); e.kx *= kd; e.ky *= kd;
    if (d > farD && !e.boss && !e.elite){ const [x, y] = spawnPos(); e.x = x; e.y = y; continue; }
    if (p.inv <= 0 && d < e.r + 9 && state === 'play') hurtPlayer(e.dmg);
  }
  for (const e of G.enemies){
    if (e.dead || e.fly || e.boss) continue;
    const a = grid.get(gkey(Math.floor(e.x / CELL), Math.floor(e.y / CELL))); if (!a) continue;
    let c = 0;
    for (const o of a){
      if (o === e || o.dead || o.fly) continue;
      const ox = e.x - o.x, oy = e.y - o.y, dd = ox * ox + oy * oy, m = e.r + o.r;

    q.x += q.vx * dt; q.y += q.vy * dt; q.rot += dt * 8;
    query(q.x, q.y + 12, q.r + 40, e => {
      if (q.life <= 0 || q.hit.has(e)) return;
      if (Math.hypot(e.x - q.x, e.y - e.r * .7 - e.z * .5 - q.y) < q.r + e.r){
        q.hit.add(e);
        const l = Math.hypot(q.vx, q.vy) || 1;
        damage(e, q.dmg, q.vx / l, q.vy / l, q.k === 'bubble' ? .5 : .8);
        if (q.k === 'star' && q.evo && !q.bounced){
          // 유성우: 처음 맞힌 적에게서 한 번 튕겨 가까운 다른 적에게 날아가요
          let best = null, bd = 240;
          query(e.x, e.y, 240, o => { if (o === e || q.hit.has(o)) return; const d = Math.hypot(o.x - e.x, o.y - e.y); if (d < bd){ bd = d; best = o; } });
          if (best){
            q.bounced = true; q.pierce = Math.max(q.pierce, 2);
            const sp2 = Math.hypot(q.vx, q.vy), dx2 = best.x - q.x, dy2 = best.y - best.r * .7 - q.y, d2 = Math.hypot(dx2, dy2) || 1;
            q.vx = dx2 / d2 * sp2; q.vy = dy2 / d2 * sp2; q.life = Math.max(q.life, .9);
            burst(q.x, q.y, ['#ffe066', '#fff'], 5, { speed:80, g:0 });
            return;
          }
        }
        if (q.k === 'star' || q.k === 'note'){ q.pierce--; if (q.pierce <= 0) q.life = 0; }
      }
    });
    if (q.life <= 0 && q.k === 'bubble') burst(q.x, q.y, ['#bfeeff', '#fff'], 6, { speed:60, g:0 });
  }
  G.proj = G.proj.filter(q => q.life > 0);
}
function checkLevel(){
  while (G.xp >= G.need){ G.xp -= G.need; G.level++; G.need = needFor(G.level); G.pending++; }
}
function updateGems(dt){
  const p = G.p;
  G.comboT -= dt; if (G.comboT <= 0) G.combo = 0;
  for (const g of G.gems){
    const dx = p.x - g.x, dy = p.y - 8 - g.y, d = Math.hypot(dx, dy) || 1;
    if (!g.m && d < S.magnet) g.m = true;
    if (g.m){ g.sp += 700 * dt; const s = Math.min(d, (120 + g.sp) * dt); g.x += dx / d * s; g.y += dy / d * s; }
    if (d < 14){ g.dead = true; G.xp += g.v * S.xp; G.combo++; G.comboT = .35; sfx('gem', 45); }
  }
  G.gems = G.gems.filter(g => !g.dead);
  checkLevel();
}
function upgradeRandom(){
  const ready = G.weapons.filter(evoReady);

function updateItems(dt){

function updateFx(dt){

function update(dt){

/* ---------- level up ---------- */
function pickChoices(ex){
  const pool = [], owned = new Set(G.weapons.map(w => w.id)), pk = Object.keys(G.passives);
  for (const w of G.weapons) if (w.lvl < 5) pool.push({ type:'w', id:w.id, wt:3 });
  if (G.weapons.length < maxWeapons()) for (const id in WPN) if (!owned.has(id)) pool.push({ type:'w', id, wt:2.2 });
  for (const id of pk) if (G.passives[id] < 5) pool.push({ type:'p', id, wt: PAS[id].wt ? 1.3 : 2.4 });
  if (pk.length < 4) for (const id in PAS) if (!(id in G.passives)) pool.push({ type:'p', id, wt: PAS[id].wt || 1.6 });
  for (const w of G.weapons) if (evoPlusReady(w)) pool.push({ type:'evoup', id:w.id, wt:3.2 });
  if (ex){ const f = pool.filter(c => !ex.has(c.type + c.id)); if (f.length >= 3) pool.splice(0, pool.length, ...f); }
  const out = [];
  const ready = G.weapons.filter(evoReady);
  if (ready.length) out.push({ type:'evo', id: ready[(Math.random() * ready.length) | 0].id });
  while (out.length < 3 && pool.length){
    let tot = 0; for (const c of pool) tot += c.wt;
    let r = Math.random() * tot, i = 0;
    for (; i < pool.length; i++){ r -= pool[i].wt; if (r <= 0) break; }
    out.push(pool.splice(Math.min(i, pool.length - 1), 1)[0]);
  }
  if (out.length < 3) out.push({ type:'heal' });
  if (out.length < 3) out.push({ type:'coin' });
  return out;
}
function evolve(id){
  const w = G.weapons.find(w => w.id === id); if (!w || w.evo) return;
  w.evo = true; w.t = .2;
  if (!meta.stats.evo.includes(id)) meta.stats.evo.push(id);
  sfx('chest'); G.shake = .2;
  burst(G.p.x, G.p.y - 14, ['#ffd166', '#ff8fc5', '#6fd0ff', '#7ee08a', '#fff'], 40, { speed:200, up:90 });
  toast(`진화! ${WPN[id].name} → ${EVO[id].name}`);
}
function applyChoice(c){
  if (c.type === 'evo') evolve(c.id);
  else if (c.type === 'evoup'){ const w = G.weapons.find(w => w.id === c.id); if (w){ w.evoLv = Math.min(EVO_PLUS_MAX, (w.evoLv || 0) + 1); burst(G.p.x, G.p.y - 14, ['#ffd166', '#ff8fc5', '#fff'], 24, { speed:160 }); } }
  else if (c.type === 'w'){ const w = G.weapons.find(w => w.id === c.id); if (w) w.lvl = Math.min(5, w.lvl + 1); else G.weapons.push(newWeapon(c.id)); }
  else if (c.type === 'p'){ G.passives[c.id] = (G.passives[c.id] || 0) + 1; recalc(); }
  else if (c.type === 'heal'){ G.healUsed = true; G.p.hp = Math.min(G.p.maxHp, G.p.hp + 40 * healMul()); }
  else if (c.type === 'coin') G.coins += 10;
}

  const bonus = win ? (st.bonus || 30 * (st.num || G.stage + 1)) : 0, pouch = Math.round(G.coins * (.1 * (meta.up.mcoin || 0) + (G.ch.mods.coin || 0))), earned = G.coins + pouch + bonus;
  meta.coins += earned; meta.stats.candy = (meta.stats.candy || 0) + earned;

  meta.best[bkey] = Math.max(prev, Math.min(G.time, BOSS_AT));

/* ---------- drawing helpers ---------- */
function ell(x, y, rx, ry, rot = 0){ X.beginPath(); X.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }
function fs(fill, lw = 2){ X.fillStyle = fill; X.fill(); X.lineWidth = lw; X.strokeStyle = INK; X.lineJoin = 'round'; X.stroke(); }
function rr(x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function blobs(arr, col, lw = 2.2){
  X.fillStyle = INK; X.beginPath(); for (const [x, y, r] of arr){ X.moveTo(x + r + lw, y); X.arc(x, y, r + lw, 0, TAU); } X.fill();
  X.fillStyle = col; X.beginPath(); for (const [x, y, r] of arr){ X.moveTo(x + r, y); X.arc(x, y, r, 0, TAU); } X.fill();
}
function starPath(x, y, r, pts = 5, inner = .5){
  X.beginPath();
  for (let i = 0; i < pts * 2; i++){ const a = -Math.PI / 2 + i * Math.PI / pts, rr2 = i % 2 ? r * inner : r; const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2; i ? X.lineTo(px, py) : X.moveTo(px, py); }
  X.closePath();
}
function drawStar(x, y, r, fill, lw = 2){ starPath(x, y, r); fs(fill, lw); }
function heartPath(x, y, s){
  X.beginPath(); X.moveTo(x, y + s * .75);
  X.bezierCurveTo(x - s * 1.25, y - s * .1, x - s * .6, y - s * 1.1, x, y - s * .38);
  X.bezierCurveTo(x + s * .6, y - s * 1.1, x + s * 1.25, y - s * .1, x, y + s * .75);
  X.closePath();
}
function glow(x, y, r, col, a){
  const g = X.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,255,255,0)');
  X.globalAlpha = a; X.fillStyle = g; X.beginPath(); X.arc(x, y, r, 0, TAU); X.fill(); X.globalAlpha = 1;
}
function gemShape(s){ X.beginPath(); X.moveTo(0, -s); X.lineTo(s * .85, -s * .2); X.lineTo(0, s); X.lineTo(-s * .85, -s * .2); X.closePath(); }

function drawCookie(){

  ell(-3, -3, 10, 9); X.fillStyle = '#f2c587'; X.fill();
  X.fillStyle = '#6b3f2a';
  for (const [a, b, r] of [[-6, -5, 2.4], [4, -7, 2], [6, 3, 2.6], [-4, 6, 2.2], [1, 0, 1.8], [-9, 2, 1.6]]){ X.beginPath(); X.arc(a, b, r, 0, TAU); X.fill(); }
}
function drawNote(col){
  X.strokeStyle = INK; X.lineWidth = 2.2; X.lineCap = 'round';
  X.beginPath(); X.moveTo(2, 3); X.lineTo(2, -9); X.quadraticCurveTo(8, -6, 6, -1); X.stroke();

}

/* ---------- render ---------- */
function render(rt){
  X.setTransform(1, 0, 0, 1, 0, 0);
  if (!G || state === 'title' || state === 'shop'){
    const st = stageBase();
    titleCam.x = rt * 18; titleCam.y = Math.sin(rt * .1) * 40;
    const z = zoom * dpr;
    X.setTransform(z, 0, 0, z, -titleCam.x * z, -titleCam.y * z);
    drawGround(st, titleCam, vw / zoom, vh / zoom);
    return;
  }
  const z = zoom * dpr, cam = G.cam;
  let sx = 0, sy = 0;
  if (G.shake > 0){ const m = Math.min(1, G.shake / .15) * 4 * dpr; sx = (Math.random() - .5) * m; sy = (Math.random() - .5) * m; }
  X.setTransform(z, 0, 0, z, -cam.x * z + sx, -cam.y * z + sy);
  const vwW = vw / zoom, vhW = vh / zoom, p = G.p;
  drawGround(G.st, cam, vwW, vhW);
  const inView = (x, y, m = 60) => x > cam.x - m && x < cam.x + vwW + m && y > cam.y - m && y < cam.y + vhW + m + 30;

  // puddles
  for (const q of G.proj){
    if (q.k !== 'puddle' || !inView(q.x, q.y, q.r + 20)) continue;
    X.globalAlpha = Math.max(0, Math.min(1, q.life * 3, (q.max - q.life) * 5));
    ell(q.x, q.y, q.r, q.r * .62); X.fillStyle = q.evo ? 'rgba(190,190,255,.45)' : 'rgba(120,210,255,.45)'; X.fill();
    X.lineWidth = 2; X.strokeStyle = 'rgba(58,46,95,.35)'; X.stroke();
    const rp = (rt * .8 + q.x * .013) % 1;
    ell(q.x, q.y, q.r * rp, q.r * .62 * rp); X.strokeStyle = 'rgba(255,255,255,.75)'; X.stroke();
    if (q.evo){
      const cols = ['#ff8fc5', '#ffd166', '#7ee08a', '#6fd0ff'];
      cols.forEach((c, i) => { X.beginPath(); X.ellipse(q.x, q.y, q.r * (.92 - i * .07), q.r * .62 * (.92 - i * .07), 0, 0, TAU); X.strokeStyle = c; X.lineWidth = 2; X.stroke(); });
    }
    X.globalAlpha = 1;
  }
  // aura
  const aura = G.weapons.find(w => w.id === 'aura');
  if (aura){
    const r = auraGeo(aura).rad * (1 + Math.sin(rt * 4) * .03);
    X.save(); ell(p.x, p.y, r, r * .9); X.fillStyle = aura.evo ? 'rgba(120,220,120,.3)' : 'rgba(126,224,138,.22)'; X.fill();
    X.setLineDash([6, 7]); X.lineDashOffset = -rt * 20; X.lineWidth = aura.evo ? 3 : 2; X.strokeStyle = 'rgba(47,154,92,.6)'; X.stroke(); X.restore();
    if (aura.evo){
      const cols = ['#ff8fc5', '#ffd166', '#ffffff', '#b48cff'];
      for (let i = 0; i < 10; i++){
        const a = rt * .6 + i * TAU / 10, x = p.x + Math.cos(a) * r * .92, y = p.y + Math.sin(a) * r * .83;
        X.fillStyle = cols[i % 4];
        for (let k = 0; k < 5; k++){ const b = k / 5 * TAU; X.beginPath(); X.arc(x + Math.cos(b) * 2.4, y + Math.sin(b) * 2.4, 2, 0, TAU); X.fill(); }
        X.fillStyle = '#ffcf4a'; X.beginPath(); X.arc(x, y, 1.4, 0, TAU); X.fill();
      }
    }
  }
  // cotton candy mines
  for (const q of G.proj){
    if (q.k !== 'mine' || !inView(q.x, q.y, 20)) continue;
    const armed = q.t >= q.arm, pulse = armed ? 1 + Math.sin(rt * 8 + q.rot) * .06 : .8;
    X.fillStyle = 'rgba(58,46,95,.16)'; ell(q.x, q.y + 1, 11, 4); X.fill();
    X.save(); X.translate(q.x, q.y - 5); X.scale(pulse, pulse);
    blobs([[-5, 1, 6], [5, 0, 6.5], [0, -4, 6.5]], '#ffd0e6', 1.8);
    X.fillStyle = '#bfeeff'; ell(4, -1, 3.6, 3); X.fill(); X.fillStyle = '#ffffff'; ell(-3, -6, 2.2, 1.4); X.fill();
    if (armed && Math.sin(rt * 6 + q.rot) > 0){ X.fillStyle = '#ff5d7a'; ell(0, 3, 1.8, 1.8); X.fill(); }
    X.restore();
  }
  // acorn targets
  for (const q of G.proj) if (q.k === 'acorn'){ ell(q.tx, q.ty, q.rad * .6, q.rad * .3); X.strokeStyle = 'rgba(138,90,59,.35)'; X.lineWidth = 2; X.stroke(); }
  // gems
  for (const g of G.gems){
    if (!inView(g.x, g.y, 20)) continue;
    const s = g.v >= 5 ? 7 : g.v >= 2 ? 6 : 5, col = g.v >= 5 ? '#ff8fc5' : g.v >= 2 ? '#7ee08a' : '#62e1ff';
    X.save(); X.translate(g.x, g.y - 4 - Math.sin(rt * 4 + g.x) * 1.2); gemShape(s); fs(col, 1.6); X.restore();
  }
  // shadows
  X.fillStyle = 'rgba(58,46,95,.18)';
  for (const e of G.enemies) if (inView(e.x, e.y)){ const s = e.fly ? .6 : 1 - Math.min(.4, e.z / (25 * e.s)); ell(e.x, e.y, 11 * e.s * s, 4 * e.s * s); X.fill(); }
  for (const it of G.items) if (inView(it.x, it.y)){ ell(it.x, it.y, it.k === 'chest' || it.k === 'gift' ? 14 : 7, 4); X.fill(); }
  ell(p.x, p.y, 10, 4); X.fill();
  const obsVis = OB.tier ? obsInView(cam.x - 100, cam.y - 60, cam.x + vwW + 100, cam.y + vhW + 160, []) : [];
  for (const b of obsVis){
    if (b.t === 'wall'){ rr(b.x - b.hw + 4, b.y - b.hh + 2, b.hw * 2 + 4, b.hh * 2 + 6, 8); X.fill(); }
    else { ell(b.x + 4, b.y + 2, b.r * 1.08, b.r * b.k * 1.1); X.fill(); }
  }

  const list = [];
  for (const e of G.enemies) if (inView(e.x, e.y, 60 * e.s)) list.push([e.y, 0, e]);
  for (const it of G.items) if (inView(it.x, it.y)) list.push([it.y, 1, it]);
  if (state !== 'dying' && state !== 'result') list.push([p.y, 2, p]);
  for (const b of obsVis) list.push([b.t === 'wall' ? b.y + b.hh : b.y, 3, b]);
  list.sort((a, b) => a[0] - b[0]);
  for (const [, type, o] of list){
    if (type === 0) drawEnemy(o, rt);
    else if (type === 1) drawItem(o, rt);
    else if (type === 3) drawObstacle(o);
    else {
      if (p.inv > 0 && Math.floor(rt * 18) % 2) X.globalAlpha = .45;
      drawDressedChar(p.x, p.y, p.fx, p.fy, p.walk, p.moving, rt, G.ch);
      X.globalAlpha = 1;
      rr(p.x - 16, p.y + 5, 32, 6, 3); X.fillStyle = 'rgba(58,46,95,.55)'; X.fill();
      const hw = 30 * Math.max(0, p.hp / p.maxHp);
      if (hw > 0){ rr(p.x - 15, p.y + 6, hw, 4, 2); X.fillStyle = p.hp / p.maxHp < .3 ? '#ff5d7a' : '#ff8fc5'; X.fill(); }
    }
  }
  // petals
  for (const w of G.weapons) if (w.id === 'petal'){
    const P = petalGeo(w);
    for (let i = 0; i < P.n; i++){
      const a = w.a + i * TAU / P.n, px = p.x + Math.cos(a) * P.rad, py = p.y + Math.sin(a) * P.rad * .85 - 10;
      X.save(); X.translate(px, py); X.rotate(a + rt * 6); X.scale(S.area * (w.evo ? 1.3 : 1), S.area * (w.evo ? 1.3 : 1));
      if (w.evo){ for (let k = 0; k < 5; k++){ X.save(); X.rotate(k * TAU / 5); ell(0, -5, 3.4, 5.5); fs(k % 2 ? '#ffd1e3' : '#ff9fc8', 1.5); X.restore(); } ell(0, 0, 2.4, 2.4); fs('#ffd166', 1.2); }
      else { ell(0, -5, 4.5, 7.5); fs('#ff9fc8', 1.8); ell(0, 5, 4.5, 7.5); fs('#ffc0da', 1.8); }
      X.restore();
    }
  }
  // ladybug friends
  for (const w of G.weapons) if (w.id === 'ladybug' && w.bugs) for (const b of w.bugs){
    X.save(); X.translate(b.x, b.y);
    const fl = Math.abs(Math.sin(b.ph)) * .8 + .2;
    X.fillStyle = 'rgba(255,255,255,.75)'; ell(-4, -3, 4 * fl + 1, 2.4, -.5); X.fill(); ell(4, -3, 4 * fl + 1, 2.4, .5); X.fill();
    ell(0, 0, 5.2, 4.6); fs('#ff5d6a', 1.6);
    X.fillStyle = INK; ell(0, -4, 3, 2); X.fill(); ell(-2.4, .6, 1.2, 1.2); X.fill(); ell(2.4, .6, 1.2, 1.2); X.fill();
    X.lineWidth = 1; X.strokeStyle = INK; X.beginPath(); X.moveTo(0, -2); X.lineTo(0, 4.4); X.stroke();
    X.restore();
  }
  // projectiles
  for (const q of G.proj){
    if (q.k === 'star'){
      if (q.evo) glow(q.x, q.y, q.r * 2.6, '#ffe28a', .7);
      X.save(); X.translate(q.x, q.y); X.rotate(q.rot); drawStar(0, 0, q.r * 1.1, q.evo ? '#ffe066' : '#ffd166', 1.8); X.restore();
    }
    else if (q.k === 'bubble'){
      const r = q.r * (1 + Math.sin(q.rot) * .05);
      if (q.evo) X.globalAlpha = .8;
      if (q.evo){ ell(q.x, q.y + 12, q.r * 3, q.r * 2.4); X.fillStyle = 'rgba(180,140,255,.08)'; X.fill(); }
      ell(q.x, q.y, r, r); X.fillStyle = q.evo ? 'rgba(200,170,255,.4)' : 'rgba(160,230,255,.45)'; X.fill(); X.lineWidth = 2; X.strokeStyle = 'rgba(58,46,95,.75)'; X.stroke();
      if (q.evo){ X.beginPath(); X.arc(q.x, q.y, r * .55, q.rot, q.rot + 4); X.strokeStyle = 'rgba(255,143,197,.85)'; X.lineWidth = 2.5; X.stroke(); }
      X.fillStyle = 'rgba(255,255,255,.85)'; ell(q.x - r * .35, q.y - r * .4, r * .25, r * .15, -.6); X.fill();
      X.globalAlpha = 1;
    } else if (q.k === 'boomerang'){
      if (q.evo) glow(q.x, q.y, q.r * 2.4, '#ffe28a', .6);
      X.save(); X.translate(q.x, q.y); X.rotate(q.rot); X.scale(q.r / 15, q.r / 15); drawCookie(); X.restore();
    } else if (q.k === 'note'){
      X.save(); X.translate(q.x, q.y); X.scale(q.r / 7, q.r / 7); drawNote(q.col); X.restore();
    } else if (q.k === 'acorn'){
      const k = Math.min(1, q.t / q.dur), x = q.sx + (q.tx - q.sx) * k, y = q.sy + (q.ty - 8 - q.sy) * k - Math.sin(k * Math.PI) * 60;
      X.save(); X.translate(x, y); X.rotate(k * 10); drawIcon('acorn', 0, 0, q.evo ? .65 : .45); X.restore();
    }
  }
  // fx
  for (const f of G.fx){
    const k = 1 - f.life / f.max;
    if (f.k === 'swing'){
      const a0 = f.spin ? f.a : f.a - 1.2, a1 = a0 + (f.spin ? TAU * Math.min(1, k * 1.3) : 2.4 * Math.min(1, k * 1.6));
      X.save(); X.translate(p.x, p.y - 12);
      X.beginPath(); X.arc(0, 0, f.range, a0, a1); X.arc(0, 0, 16, a1, a0, true); X.closePath();
      const g = X.createRadialGradient(0, 0, 16, 0, 0, f.range);
      g.addColorStop(0, 'rgba(126,224,181,0)'); g.addColorStop(.55, `rgba(255,209,102,${.55 * (1 - k * .5)})`); g.addColorStop(1, `rgba(255,143,197,${.7 * (1 - k * .5)})`);
      X.fillStyle = g; X.fill();
      const tx = Math.cos(a1) * (f.range - 8), ty = Math.sin(a1) * (f.range - 8);
      X.lineCap = 'round'; X.strokeStyle = INK; X.lineWidth = 4.5; X.beginPath(); X.moveTo(Math.cos(a1) * 12, Math.sin(a1) * 12); X.lineTo(tx, ty); X.stroke();

      drawStar(tx, ty, 7, '#ffd166', 2);
      X.restore();
    } else if (f.k === 'chain'){
      X.globalAlpha = 1 - k;
      X.beginPath(); X.moveTo(f.x1, f.y1);
      for (let i = 1; i < 5; i++){ const t = i / 5; X.lineTo(f.x1 + (f.x2 - f.x1) * t + (hash(f.seed, i) - .5) * 14, f.y1 + (f.y2 - f.y1) * t + (hash(i, f.seed) - .5) * 14); }
      X.lineTo(f.x2, f.y2);
      X.strokeStyle = INK; X.lineWidth = 5; X.lineJoin = 'round'; X.stroke(); X.strokeStyle = '#9fe8ff'; X.lineWidth = 2.5; X.stroke();
      X.globalAlpha = 1;
    } else if (f.k === 'beam'){
      X.save(); X.translate(f.x, f.y); X.rotate(f.a); X.globalAlpha = Math.max(0, 1 - k * k); X.lineCap = 'round';
      const w2 = f.wid * (1 + Math.sin(k * 30) * .08);
      X.strokeStyle = f.hot ? 'rgba(255,150,70,.35)' : 'rgba(255,214,102,.4)'; X.lineWidth = w2 * 2.6; X.beginPath(); X.moveTo(8, 0); X.lineTo(f.len, 0); X.stroke();
      X.strokeStyle = f.hot ? '#ffb347' : '#ffe066'; X.lineWidth = w2; X.stroke();
      X.strokeStyle = '#fffbe6'; X.lineWidth = Math.max(1.5, w2 * .4); X.stroke();
      drawStar(f.len, 0, 5 + w2 * .3, '#fff3a8', 1.4);
      X.restore(); X.globalAlpha = 1;
    } else if (f.k === 'boom'){
      const r = f.r * (.4 + k * .7);
      ell(f.x, f.y, r, r * .8); X.fillStyle = `rgba(255,209,102,${.5 * (1 - k)})`; X.fill(); X.lineWidth = 3 * (1 - k) + .5; X.strokeStyle = `rgba(255,255,255,${1 - k})`; X.stroke();
    } else if (f.k === 'bolt'){
      X.globalAlpha = 1 - k;
      blobs([[f.x - 12, f.y - 150, 10], [f.x, f.y - 156, 13], [f.x + 13, f.y - 149, 9]], '#ffffff', 2);
      X.beginPath(); X.moveTo(f.x, f.y - 140);
      let yy = f.y - 140, xx = f.x;
      for (let i = 1; i <= 6; i++){ yy += 23; xx = f.x + (i < 6 ? (hash(f.seed, i) - .5) * 18 : 0); X.lineTo(xx, yy); }
      X.strokeStyle = INK; X.lineWidth = 7; X.lineJoin = 'round'; X.stroke(); X.strokeStyle = f.evo ? '#9fe8ff' : '#ffd166'; X.lineWidth = 4; X.stroke();
      ell(f.x, f.y, 22 * S.area, 10 * S.area); X.fillStyle = 'rgba(255,237,150,.6)'; X.fill();
      X.globalAlpha = 1;

  }
  // particles
  for (const q of G.parts){
    X.globalAlpha = Math.max(0, Math.min(1, q.life / q.max * 1.4));
    if (q.type === 'star'){ starPath(q.x, q.y, q.size * 1.3); X.fillStyle = q.col; X.fill(); }
    else { X.fillStyle = q.col; X.beginPath(); X.arc(q.x, q.y, q.size, 0, TAU); X.fill(); }
  }
  X.globalAlpha = 1;
  // damage numbers
  X.font = '13px Jua, "Gowun Dodum", sans-serif'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.lineJoin = 'round';
  for (const t of G.texts){
    X.globalAlpha = Math.min(1, t.life * 3);
    X.font = t.big ? '18px Jua, "Gowun Dodum", sans-serif' : '13px Jua, "Gowun Dodum", sans-serif';
    X.lineWidth = t.big ? 4 : 3; X.strokeStyle = INK; X.strokeText(t.txt, t.x, t.y); X.fillStyle = t.col; X.fillText(t.txt, t.x, t.y);

  const eq = equipFor(ch), slots = [['aurora', '오로라'], ['wings', '날개'], ['face', '표정']];
  const ov = document.createElement('div'); ov.className = 'helpov';
  const draw = () => {
    ov.innerHTML = `<div class="helpbox outbox" role="dialog" aria-modal="true" aria-labelledby="outTitle"><h3 id="outTitle">${ch.name} 치장</h3>
      <canvas id="outPrev" width="200" height="170" aria-hidden="true"></canvas>
      ${slots.map(([slot, label]) => { const own = COS_LIST.filter(it => it.slot === slot && meta.ownedCos.includes(cosKey(it))); return `<div class="outrow"><b>${label}</b><div class="outchips"><button class="outchip${!eq[slot] ? ' on' : ''}" data-slot="${slot}" data-id="">없음</button>${own.map(it => `<button class="outchip${eq[slot] === it.id ? ' on' : ''}" data-slot="${slot}" data-id="${it.id}">${it.name}</button>`).join('')}${own.length ? '' : '<span class="outnone">가진 게 없어요</span>'}</div></div>`; }).join('')}
      <p class="outhint">치장템은 별사탕 상점 [치장] 탭에서 살 수 있어요.</p>
      <button class="big" id="outClose">다 입었어요</button></div>`;
    const c = ov.querySelector('#outPrev'), prev = X; X = c.getContext('2d');
    X.fillStyle = '#eef8ff'; rr(0, 0, 200, 170, 16); X.fill(); X.fillStyle = '#cff3b8'; X.beginPath(); X.ellipse(100, 146, 60, 16, 0, 0, TAU); X.fill();
    X.setTransform(2.2, 0, 0, 2.2, 100, 148); drawDressedChar(0, 0, 0, .5, 0, false, 1, ch); X = prev;
    ov.querySelectorAll('.outchip').forEach(b => b.addEventListener('click', () => { eq[b.dataset.slot] = b.dataset.id || null; saveMeta(); sfx('buy'); draw(); }));
    ov.querySelector('#outClose').addEventListener('click', close);
  };
  const close = () => { ov.remove(); if (onClose) onClose(); };
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  draw(); screenEl.appendChild(ov);
}

  }

        <dt>얻은 별사탕</dt><dd>${r.earned}${r.pouch ? `<span class="chip">주머니 +${r.pouch}</span>` : ''}${r.bonus ? `<span class="chip">클리어 +${r.bonus}</span>` : ''}</dd>
      </dl>
      ${r.unlock ? `<p class="lead"><b>${r.unlock}</b> 스테이지가 열렸어요!</p>` : `<p class="lead">${r.win ? '다른 스테이지에도 도전해 보세요.' : '별사탕으로 강화하고 다시 도전해 봐요.'}</p>`}
      <div class="row"><button class="big" id="bRetry">다시 도전</button><button class="big alt" id="bHome">마을로</button></div>
    </div></div>`;
    $('bRetry').addEventListener('click', () => { ensureAudio(); newRun(G.stage); state = 'play'; setScreen(null); });
    $('bHome').addEventListener('click', () => { state = 'title'; setScreen('title'); });
    $('bRetry').focus({ preventScroll:true });
  }
}
function drawHero(rt){
  if (!heroCv || !heroCv.isConnected) return;
  const prev = X; X = heroCv.getContext('2d');
  X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, heroCv.width, heroCv.height);
  X.fillStyle = stageBase().ground; X.beginPath(); X.ellipse(120, 205, 140, 56, 0, 0, TAU); X.fill();
  X.setTransform(1, 0, 0, 1, 0, 0);
  if (randChar){
    // 랜덤: 해금한 캐릭터들의 시작 무기가 번갈아 돌아요
    const pool = randPool();
    for (let i = 0; i < 3; i++){ const a = rt * 1.3 + i * TAU / 3, c = pool[(Math.floor(rt / 1.2) + i) % pool.length]; drawIcon(c.start, 120 + Math.cos(a) * 84, 132 + Math.sin(a) * 36, .7); }
    X.setTransform(4, 0, 0, 4, 120, 186);
    X.fillStyle = 'rgba(58,46,95,.18)'; ell(0, 0, 11, 4); X.fill();
    drawMystery(0, 0, rt);
    X = prev; return;
  }
  const ch = CHARS[selChar];
  // the character's starting weapon orbits around it
  for (let i = 0; i < 3; i++){
    const a = rt * 1.3 + i * TAU / 3;
    drawIcon(ch.start2 && i === 1 ? ch.start2 : ch.start, 120 + Math.cos(a) * 84, 132 + Math.sin(a) * 36, .7);
  }
  X.setTransform(4, 0, 0, 4, 120, 186);
  X.fillStyle = 'rgba(58,46,95,.18)'; ell(0, 0, 11, 4); X.fill();
  drawDressedChar(0, 0, Math.sin(rt * .8) * .6, .5, rt * .5, false, rt, ch);
  X = prev;
}

/* ---------- loop ---------- */
let last = performance.now(), dashCool = false;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const rt = now / 1000;
  if (G){
    if (state === 'play'){
      const sim = dt * gameSpeed, n = Math.max(1, Math.ceil(sim / (1 / 40))), h = sim / n;
      for (let i = 0; i < n && state === 'play'; i++) update(h);
    }
    else if (state === 'dying'){ G.dieT -= dt; updateFx(dt); if (G.dieT <= 0) showResult(false); }
    if (state !== 'title' && state !== 'shop'){
      const [cx, cy] = camTarget(), k = Math.min(1, dt * 8);
      G.cam.x += (cx - G.cam.x) * k; G.cam.y += (cy - G.cam.y) * k;
    }
    const cool = G.p.dashCd > 0;
    if (cool !== dashCool){ dashCool = cool; btnDash.classList.toggle('cool', cool); }
  }
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
  render(rt);
  drawHero(rt);
  drawCosPrev(rt);
  drawVillage(rt);
  if (V.msgT > 0 && (V.msgT -= dt) <= 0){ const el = document.getElementById('vMsg'); if (el) el.hidden = true; }
  requestAnimationFrame(frame);
}

/* ---------- layout ---------- */
function readSafe(){
  const cs = getComputedStyle($('safeProbe'));
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
}
function checkRotate(){
  const coarse = matchMedia('(pointer: coarse)').matches, portrait = innerHeight > innerWidth, o = settings.orient;
  const wrong = (o === 'landscape' && portrait) || (o === 'portrait' && !portrait);
  const show = coarse && wrong && !rotateDismissed;
  if (show){
    const land = o === 'landscape';
    $('rotTitle').textContent = land ? '휴대폰을 가로로 돌려 주세요' : '휴대폰을 세로로 돌려 주세요';
    $('rotLead').textContent = (land ? '가로 모드' : '세로 모드') + '로 설정되어 있어요. 화면 방향은 설정에서 바꿀 수 있어요.';
  }
  $('rotate').hidden = !show;
}
function applyOrientation(){
  try {
    const so = screen.orientation;
    if (so){
      if (settings.orient === 'auto'){ if (so.unlock) so.unlock(); }
      else if (so.lock) so.lock(settings.orient).catch(() => {});
    }
  } catch(e){}
  rotateDismissed = false; checkRotate();
}
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  vw = innerWidth; vh = innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  zoom = Math.max(.6, Math.min(2.6, Math.max(.85, Math.min(2.2, Math.min(vh / (T * 12.5), vw / (T * 14)))) * (settings.view || 1)));
  readSafe(); checkRotate();
}
addEventListener('resize', resize);

function start(){
  resize(); applyOrientation();
  try { achInit(); } catch(e){}
  state = 'title'; setScreen('title');
  requestAnimationFrame(frame);
}
const hot = window.claude?.hot;
if (hot && hot.ready) hot.ready(start); else start();
})();
</script>
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
