<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3fb4e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="방울섬 서바이벌">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<title>방울섬 서바이벌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed canvas field with sticker HUD; one floating joystick anywhere, dash button bottom-right; menus are centered sticker panels */
:root{
  --sea:#3fb4e0;
  --ink:#3a2e5f;
  --paper:#fffdf8;
  --pink:#ff6f9f;
  --mint:#4fd1b5;
  --sun:#ffd166;
  --soft:#5b5080;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--sea);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
body{word-break:keep-all;font-family:var(--font-body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;touch-action:none;overflow:hidden;background:var(--sea)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#safeProbe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#touchZone{position:absolute;inset:0}

#pad{position:absolute;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:none}
body.touch #pad{display:block}
body.menu #pad,body.menu #topBtns{display:none}
.pbtn{width:78px;height:78px;border:3px solid var(--ink);border-radius:50%;background:var(--mint);font-family:var(--font-display);font-size:18px;color:var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;touch-action:none;cursor:pointer;padding:0;transition:opacity .15s}
.pbtn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pbtn.cool{opacity:.45}

#topBtns{position:absolute;top:calc(env(safe-area-inset-top,0px) + 30px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ibtn svg{width:20px;height:20px;display:block}
.ibtn.spd{width:50px;font-family:var(--font-display);font-size:16px;font-variant-numeric:tabular-nums}
.ibtn.spd.fast{background:var(--sun)}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.seg button{font-family:var(--font-display);font-size:15px;border:0;border-left:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--sun)}
.seglabel{font-family:var(--font-display);font-size:15px}
.card.evo{background:#fff3c4}
.card .ct.evo{background:var(--sun)}
.card .hint2{font-size:12px;color:var(--soft)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;width:100%}
.recipe{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff}
.recipe.got{background:#fff3c4}
.formula{display:flex;align-items:center;gap:2px;font-family:var(--font-display);font-size:15px}
.formula canvas{width:30px;height:30px}
.recipe .rn{font-family:var(--font-display);font-size:16px}
.recipe .rd{grid-column:1/-1;font-size:13px;color:var(--soft);line-height:1.4}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--font-display);font-size:17px;padding:8px 18px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;animation:pop .35s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.screen{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;overflow:auto;background:rgba(58,46,95,.45);padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;touch-action:auto}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:18px 22px;max-width:640px;width:100%;box-sizing:border-box;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.panel.narrow{max-width:460px}
.art{flex:0 0 auto;width:120px;height:120px;max-width:100%;border-radius:50%;background:#b8ecf7;border:3px solid var(--ink)}
.charbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.charbtn .cname{font-family:var(--font-display);font-size:18px}
.charbtn small,.chcard small{font-family:var(--font-body);font-size:12px;color:var(--soft)}
.charbtn .chg{font-family:var(--font-display);font-size:13px;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;box-shadow:0 2px 0 var(--ink)}
.charbtn:active .art{transform:scale(.97)}
.chars{max-width:100%;min-width:0;display:flex;gap:7px;overflow-x:auto;padding:4px 4px 8px;scroll-snap-type:x proximity;touch-action:pan-x;scrollbar-width:thin}
.chars .chcard{flex:0 0 132px;scroll-snap-align:start}
.picwrap{position:relative;display:block}
.chcard.locked .chpic{filter:grayscale(.75) brightness(.92)}
.chcard.locked{background:#f4f1fb}

.lockbadge{position:absolute;right:-4px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--sun);display:grid;place-items:center}
.lockbadge svg{width:15px;height:15px}
.unlock{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:3px;font-family:var(--font-display);font-size:13px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;line-height:1.2;white-space:nowrap;min-height:26px;box-sizing:border-box}
.unlock canvas{width:18px;height:18px}
.chpas{display:flex;flex-direction:column;align-items:center;gap:2px;background:#eef9f5;border:2px dashed #7fcfb5;border-radius:10px;padding:3px 5px;width:100%;box-sizing:border-box}
.chpl{font-family:var(--font-display);font-size:11px;color:#2f8f72}
.chpi{display:flex;flex-direction:column;align-items:flex-start;gap:1px;font-size:11px}
.chpi span{display:inline-flex;align-items:center;gap:2px}
.chpi canvas{width:16px;height:16px}
.unlock.ask{background:var(--pink)}
.unlock.short{background:#fff;color:#c2416f}
.chcard{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:9px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--ink);font-family:var(--font-body);min-width:0}
.chcard.sel{background:#fff3c4;outline:3px solid var(--pink);outline-offset:2px}
.chpic{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--ink)}
.chn{font-family:var(--font-display);font-size:18px}
.chw .sig{font-weight:400;font-size:11px;background:#e6f7f0;color:#2f8f72;border-radius:6px;padding:0 4px;margin-left:2px}
.chw{display:flex;align-items:center;gap:3px;font-size:12px;white-space:nowrap;font-family:var(--font-display)}
.chw canvas{width:22px;height:22px}
.cht{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;line-height:1.35;text-align:center}
.cht .neg{color:#c2416f}
.cht .pos{color:#2f8f72;white-space:nowrap;font-size:11px}
.txt{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px}
.eyebrow{margin:0;font-family:var(--font-display);font-size:13px;letter-spacing:.08em;color:var(--pink)}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(30px,5.6vw,44px)}
h1 span{color:var(--pink)}
h2{font-size:clamp(24px,4.4vw,32px)}
.lead{margin:0;font-size:15px;line-height:1.5;color:var(--soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--font-display);font-size:20px;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 22px;cursor:pointer}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.big.alt{background:var(--paper);font-size:17px}
.minibtn{font-family:var(--font-display);font-size:14px;background:var(--mint);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:3px 12px;cursor:pointer}
.minibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.minibtn.gear{display:inline-flex;align-items:center;gap:4px;background:var(--paper)}
.minibtn.gear svg{width:15px;height:15px}
.credit{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-family:var(--font-display);font-size:13px;color:#fffdf8;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink);pointer-events:none;letter-spacing:.03em}
.setcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.setcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.setgrp{display:flex;flex-direction:column;gap:8px;border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;background:#fff}
.sethead{margin:0;font-family:var(--font-display);font-size:14px;color:var(--pink);letter-spacing:.06em}
.setrow{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px}
.setrow label,.setrow .lab{font-family:var(--font-display);font-size:16px}
.setrow .seg,.setrow .toggle{grid-column:2 / 4;justify-self:start}
.setrow input[type=range]{width:100%;min-width:0;accent-color:var(--pink);touch-action:auto;height:28px}
.setrow output{font-family:var(--font-display);font-size:15px;min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
.toggle{font-family:var(--font-display);font-size:15px;border:2.5px solid var(--ink);border-radius:999px;padding:3px 16px;cursor:pointer;color:var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink)}
.toggle[aria-pressed="true"]{background:var(--mint)}
.big.warn{background:var(--pink)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.candy{font-family:var(--font-display);font-size:16px;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.candy canvas{width:22px;height:22px}

.stages{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.stages .stage{flex:0 0 96px;scroll-snap-align:start}
.stage .sn{font-size:11px;color:var(--soft);font-family:var(--font-body)}
.stage{font-family:var(--font-display);font-size:15px;white-space:nowrap;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:6px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.stage .sw{width:100%;height:10px;border-radius:6px;border:2px solid var(--ink);box-sizing:border-box}
.stage .ss{font-family:var(--font-body);font-size:12px;color:var(--soft)}
.stage.sel{background:var(--sun)}
.modeseg{box-shadow:0 2px 0 var(--ink);border-width:2px;border-radius:10px}
.modeseg button{font-size:13px;padding:2px 10px;display:inline-flex;align-items:center;gap:3px}
.modeseg button svg{width:11px;height:11px}
.modeseg #mHard[aria-pressed="true"]{background:#ff7a8a;color:#fff}
.modeseg #mHard.locked{color:#9a93b5}
.stage.hard{border-color:#8a2340;box-shadow:0 3px 0 #8a2340}
.stage.hard .sn{color:#c2416f;font-family:var(--font-display)}
.stage.hard.sel{background:#ffb3bd}
.stage.chal{border-color:#7a2f5a;box-shadow:0 3px 0 #7a2f5a;background:#fff0f4}
.stage.chal .sn{color:#c2416f;font-family:var(--font-display)}
.stage.chal.sel{background:#ffb8cc}
.chdiv{flex:0 0 auto;align-self:center;writing-mode:vertical-rl;font-family:var(--font-display);font-size:12px;color:#fff;background:#c2416f;border-radius:8px;padding:6px 3px;letter-spacing:.1em}
.rulechips{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-right:4px}
.rulechips span{font-family:var(--font-display);font-size:12px;background:#ffe0ea;color:#a3335c;border:1.5px solid #c2416f;border-radius:999px;padding:0 7px}
.stage:disabled{opacity:.45;cursor:default}
.hint{font-size:13px;color:var(--soft);margin:0}

.lvl{max-width:760px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.lvl h2{color:var(--paper);-webkit-text-stroke:0;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.bag{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:7px 12px 5px;width:100%;box-sizing:border-box}
.grp{display:flex;align-items:flex-start;gap:4px;flex-wrap:wrap;justify-content:center}
.gl{font-family:var(--font-display);font-size:13px;color:var(--soft);align-self:center;margin-right:4px;white-space:nowrap}
.slot{width:58px;display:flex;flex-direction:column;align-items:center;gap:3px}
.sic{position:relative;width:34px;height:34px;border:2px solid var(--ink);border-radius:9px;background:#fff;display:grid;place-items:center;box-sizing:border-box}
.sic canvas{width:28px;height:28px}
.slot.evo .sic{background:#fff3c4}
.slot.up .sic{outline:3px solid var(--pink);outline-offset:1px}
.slot.empty .sic{border-style:dashed;opacity:.45;background:transparent}
.lv{position:absolute;right:-9px;bottom:-6px;font-family:var(--font-display);font-size:10px;background:var(--mint);border:1.5px solid var(--ink);border-radius:999px;padding:0 4px;line-height:1.35;white-space:nowrap}
.slot.evo .lv{background:var(--sun)}
.sn2{font-size:11px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.empty .sn2{color:var(--soft)}
.lvl h2{font-size:clamp(22px,4vw,28px)}
.lvlhead{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.reroll{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:4px 14px 4px 8px;cursor:pointer}
.reroll canvas{width:22px;height:22px}
.reroll .rc{background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:0 7px;font-size:13px}
.reroll .key{font-size:11px;color:var(--soft)}
body.touch .reroll .key{display:none}
.reroll:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.reroll:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
@media (max-width:540px){.cards{grid-template-columns:1fr}}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:12px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;cursor:pointer;font-family:var(--font-body);color:var(--ink);min-width:0}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.card canvas{width:48px;height:48px}
.card .cn{font-family:var(--font-display);font-size:19px}
.card .ct{font-family:var(--font-display);font-size:13px;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.card .ct.new{background:var(--pink)}
.card .cd{font-size:14px;line-height:1.45}
.card .key{font-size:12px;color:var(--soft)}
body.touch .card .key{display:none}
@media (max-width:540px){.card{flex-direction:row;text-align:left;align-items:center}.card .cbody{align-items:flex-start}}
.cbody{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}

.shoptabs{align-self:flex-start}
.shoptabs button{font-size:16px;padding:5px 16px}
.cosnow{display:flex;gap:14px;align-items:center}
.cosnow canvas{width:110px;height:110px;flex:0 0 auto;border-radius:50%;border:3px solid var(--ink)}
.cosmsg{margin:6px 0 0;font-family:var(--font-display);font-size:15px;color:#2f8f72;min-height:1.2em}
.cosgrp{display:flex;flex-direction:column;gap:6px}
.cosgrp .sethead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cosgrp small{font-family:var(--font-body);font-size:12px;color:var(--soft);letter-spacing:0}
.cosprice .candy{font-size:14px}
.coslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:2px 2px 8px;touch-action:pan-y}
.cositem{min-width:0;display:flex;touch-action:pan-y;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:6px 6px 8px;cursor:pointer;color:var(--ink);font-family:var(--font-body)}
.cositem canvas{width:96px;height:96px;border-radius:12px}
.cositem .cn2{font-family:var(--font-display);font-size:13px;white-space:nowrap}
.cositem .cst{font-family:var(--font-display);font-size:12px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;white-space:nowrap}
.cositem.own .cst{background:var(--mint)}
.cositem.on{background:#fff3c4;outline:3px solid var(--pink);outline-offset:1px}
.cositem.on .cst{background:var(--pink);color:#fff}
.cositem.ask .cst{background:var(--pink);color:#fff}
.shop{display:grid;gap:8px;width:100%;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
@media (max-width:420px){.shop{grid-template-columns:1fr}}
.sinfo{min-width:0}
.srow.maxed{background:#fff3c4}
.sumbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:#f2fbf7;border:2px dashed #7fcfb5;border-radius:14px;padding:7px 10px}
.sumlab{font-family:var(--font-display);font-size:13px;color:#2f8f72;margin-right:4px}
.sumchip{font-family:var(--font-display);font-size:13px;background:#fff;border:2px solid #7fcfb5;border-radius:999px;padding:1px 9px;color:var(--ink);white-space:nowrap}
.sumbox .none{font-size:13px;color:#9a93b5}
.stot{font-size:13px;color:var(--ink);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;margin:1px 0}
.stot b{font-family:var(--font-display);font-weight:400;font-size:14px;color:#2f8f72;background:#e6f7f0;border-radius:6px;padding:0 6px}
.stot .none{color:#9a93b5}
.stot .nx{font-size:12px;color:var(--soft)}
.srow .lvn{font-family:var(--font-display);font-size:12px;color:var(--soft);letter-spacing:0}
.srow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;background:#fff}
.srow canvas{width:40px;height:40px}
.srow .sn{font-family:var(--font-display);font-size:17px}
.srow .sd{font-size:13px;color:var(--soft)}
.pips{letter-spacing:2px;color:var(--pink);font-size:12px}
.buy{font-family:var(--font-display);font-size:15px;background:var(--sun);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:5px 10px;cursor:pointer;color:var(--ink);white-space:nowrap}

}

function inputVec(){
  let x = 0, y = 0;
  for (const k of keys){ const m = MOVE[k]; if (m){ x += m[0]; y += m[1]; } }
  const km = Math.hypot(x, y); if (km > 0){ x /= km; y /= km; }
  if (joy.active){ x += joy.vx; y += joy.vy; }

/* ---------- 하드 모드 장애물 (바위 · 큰 바위 · 벽) ---------- */
// 하드 1~5단계: 작은 바위 / 6~10단계: 돌아가야 하는 큰 바위 / 11~15단계: 길을 막는 벽
const OCH = 400;
let OB = { tier:0, seed:0, map:new Map() };
const OBS_TEXT = ['', '군데군데 바위가 놓여 있어요.', '돌아서 가야 하는 큰 바위가 있어요.', '길을 막는 벽이 곳곳에 있어요.'];
const obsTierOf = i => i < 5 ? 1 : i < 10 ? 2 : 3;
function mkRng(a){ return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function obsReset(){ OB = { tier: G.st.hard ? obsTierOf(G.stage) : 0, seed: G.stage * 31 + 7, map: new Map() }; }
const obsExt = b => b.t === 'wall' ? [b.hw, b.hh] : [b.r, b.r * b.k];
function obsChunk(cx, cy){
  const key = gkey(cx, cy); let a = OB.map.get(key); if (a) return a;
  a = []; OB.map.set(key, a);
  const R = mkRng((cx * 73856093) ^ (cy * 19349663) ^ (OB.seed * 83492791)), x0 = cx * OCH, y0 = cy * OCH, M = 30, GAP = 58;
  const place = o => {
    const [hw, hh] = obsExt(o);
    for (let n = 0; n < 10; n++){
      o.x = x0 + M + hw + R() * (OCH - 2 * M - 2 * hw); o.y = y0 + M + hh + R() * (OCH - 2 * M - 2 * hh);
      if (Math.abs(o.x) < 190 + hw && Math.abs(o.y) < 170 + hh) continue; // 시작 자리는 비워 둬요
      if (a.some(b => { const [bw, bh] = obsExt(b); return Math.abs(o.x - b.x) < hw + bw + GAP && Math.abs(o.y - b.y) < hh + bh + GAP; })) continue;
      o.v = R(); a.push(o); return;
    }
  };
  const rock = () => place({ t:'rock', r:13 + R() * 8, k:.72 });
  const boulder = () => place({ t:'boulder', r:46 + R() * 22, k:.66 });
  if (OB.tier === 1){ const n = 3 + (R() < .5 ? 1 : 0); for (let i = 0; i < n; i++) rock(); }
  else if (OB.tier === 2){ boulder(); if (R() < .55) boulder(); rock(); rock(); }
  else if (OB.tier === 3){
    const n = 1 + (R() < .55 ? 1 : 0);
    for (let i = 0; i < n; i++){ const L = 80 + R() * 62; place(R() < .5 ? { t:'wall', hw:L, hh:14 } : { t:'wall', hw:14, hh:L }); }
    if (R() < .6) boulder(); rock(); if (R() < .5) rock();
  }
  return a;
}
// 원(반지름 r)이 장애물과 겹치면 밖으로 밀어내요. 부딪힌 면의 방향을 돌려줘요.
function obsResolve(o, r){
  if (!OB.tier) return null;
  let hit = null;
  const cx0 = Math.floor((o.x - r) / OCH), cx1 = Math.floor((o.x + r) / OCH), cy0 = Math.floor((o.y - r) / OCH), cy1 = Math.floor((o.y + r) / OCH);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) for (const b of obsChunk(cx, cy)){
    if (b.t === 'wall'){
      const qx = Math.max(b.x - b.hw, Math.min(b.x + b.hw, o.x)), qy = Math.max(b.y - b.hh, Math.min(b.y + b.hh, o.y));
      const dx = o.x - qx, dy = o.y - qy, d = Math.hypot(dx, dy);
      if (d >= r) continue;
      if (d < .001){
        const px = b.hw - Math.abs(o.x - b.x), py = b.hh - Math.abs(o.y - b.y);
        if (px < py){ const sx = Math.sign(o.x - b.x) || 1; o.x = b.x + sx * (b.hw + r); hit = [sx, 0, b]; }
        else { const sy = Math.sign(o.y - b.y) || 1; o.y = b.y + sy * (b.hh + r); hit = [0, sy, b]; }
      } else { const nx = dx / d, ny = dy / d; o.x = qx + nx * r; o.y = qy + ny * r; hit = [nx, ny, b]; }
    } else {
      const dx = o.x - b.x, dy = (o.y - b.y) / b.k, d = Math.hypot(dx, dy), RR = b.r + r;
      if (d >= RR) continue;
      const nx = d > .001 ? dx / d : 0, ny = d > .001 ? dy / d : 1;
      o.x = b.x + nx * RR; o.y = b.y + ny * RR * b.k; hit = [nx, ny, b];

}
function obsInView(x0, y0, x1, y1, out){
  for (let cy = Math.floor(y0 / OCH); cy <= Math.floor(y1 / OCH); cy++) for (let cx = Math.floor(x0 / OCH); cx <= Math.floor(x1 / OCH); cx++) for (const b of obsChunk(cx, cy)) out.push(b);
  return out;
}
function updatePlayer(dt){
  const p = G.p, iv = inputVec();
  p.moving = iv.m > .12;
  if (p.moving){ const l = Math.hypot(iv.x, iv.y); p.fx = iv.x / l; p.fy = iv.y / l; p.walk += dt * (.4 + iv.m * .6); }
  if (wantDash){ wantDash = false; if (p.dashCd <= 0){ p.dashT = .18; p.dashCd = 2.2; p.inv = Math.max(p.inv, .32); sfx('dash'); } }
  let mx = iv.x * 100 * S.speed, my = iv.y * 100 * S.speed;
  if (p.dashT > 0){
    p.dashT -= dt; mx = p.fx * 380; my = p.fy * 380;
    G.parts.push({ x:p.x + (Math.random() - .5) * 8, y:p.y - 10, vx:0, vy:-10, life:.3, max:.3, col:'rgba(255,255,255,.9)', size:6, g:0, type:'dot' });
  }
  p.x += mx * dt; p.y += my * dt;
  if (OB.tier){ obsResolve(p, 8); obsResolve(p, 8); }
  p.dashCd -= dt; p.inv -= dt;

        if (q.k === 'star' || q.k === 'note'){ q.pierce--; if (q.pierce <= 0) q.life = 0; }
      }
    });

  }
  G.proj = G.proj.filter(q => q.life > 0);
}
function checkLevel(){
  while (G.xp >= G.need){ G.xp -= G.need; G.level++; G.need = needFor(G.level); G.pending++; }
}
function updateGems(dt){
  const p = G.p;
  G.comboT -= dt; if (G.comboT <= 0) G.combo = 0;
  for (const g of G.gems){
    const dx = p.x - g.x, dy = p.y - 8 - g.y, d = Math.hypot(dx, dy) || 1;
    if (!g.m && d < S.magnet) g.m = true;
    if (g.m){ g.sp += 700 * dt; const s = Math.min(d, (120 + g.sp) * dt); g.x += dx / d * s; g.y += dy / d * s; }
    if (d < 14){ g.dead = true; G.xp += g.v * S.xp; G.combo++; G.comboT = .35; sfx('gem', 45); }
  }
  G.gems = G.gems.filter(g => !g.dead);
  checkLevel();
}
function upgradeRandom(){
  const ready = G.weapons.filter(evoReady);

  for (const id in G.passives) if (G.passives[id] < 5) c.push({ type:'p', id });
  if (!c.length){ G.coins += 20; return '별사탕 +20'; }

function updateItems(dt){
  const p = G.p;

    G.giftT = (28 + Math.random() * 10) / 1.2;
    const a = Math.random() * TAU, r = 220 + Math.random() * 120;

    if (OB.tier){ obsResolve(gift, 18); obsResolve(gift, 18); }
    G.items.push(gift);
  }
  for (const it of G.items){
    it.age += dt;
    if (it.z > 0 || it.vz > 0){ it.vz -= 700 * dt; it.z += it.vz * dt; if (it.z <= 0){ it.z = 0; it.vz = it.vz < -140 ? -it.vz * .45 : 0; } }
    const dx = p.x - it.x, dy = p.y - it.y, d = Math.hypot(dx, dy) || 1;
    if ((it.k === 'candy' || it.k === 'heart' || it.k === 'magnet' || it.k === 'bag') && it.age > .4 && d < 70){ const s = Math.min(d, 260 * dt); it.x += dx / d * s; it.y += dy / d * s; }
    if (d < 22 && it.age > .35 && it.z < 8){

}
function updateFx(dt){
  for (const q of G.parts){ q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt; q.vx *= .985; }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const t of G.texts){ t.life -= dt; t.y -= 34 * dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  for (const f of G.fx) f.life -= dt;

/* ---------- level up ---------- */
function pickChoices(ex){
  const pool = [], owned = new Set(G.weapons.map(w => w.id)), pk = Object.keys(G.passives);
  for (const w of G.weapons) if (w.lvl < 5) pool.push({ type:'w', id:w.id, wt:3 });
  if (G.weapons.length < maxWeapons()) for (const id in WPN) if (!owned.has(id)) pool.push({ type:'w', id, wt:2.2 });
  for (const id of pk) if (G.passives[id] < 5) pool.push({ type:'p', id, wt:2.4 });
  if (pk.length < 4) for (const id in PAS) if (!(id in G.passives)) pool.push({ type:'p', id, wt:1.6 });
  for (const w of G.weapons) if (evoPlusReady(w)) pool.push({ type:'evoup', id:w.id, wt:3.2 });
  if (ex){ const f = pool.filter(c => !ex.has(c.type + c.id)); if (f.length >= 3) pool.splice(0, pool.length, ...f); }
  const out = [];
  const ready = G.weapons.filter(evoReady);
  if (ready.length) out.push({ type:'evo', id: ready[(Math.random() * ready.length) | 0].id });
  while (out.length < 3 && pool.length){
    let tot = 0; for (const c of pool) tot += c.wt;
    let r = Math.random() * tot, i = 0;
    for (; i < pool.length; i++){ r -= pool[i].wt; if (r <= 0) break; }
    out.push(pool.splice(Math.min(i, pool.length - 1), 1)[0]);
  }
  if (out.length < 3) out.push({ type:'heal' });
  if (out.length < 3) out.push({ type:'coin' });
  return out;
}
function evolve(id){
  const w = G.weapons.find(w => w.id === id); if (!w || w.evo) return;
  w.evo = true; w.t = .2;
  sfx('chest'); G.shake = .2;
  burst(G.p.x, G.p.y - 14, ['#ffd166', '#ff8fc5', '#6fd0ff', '#7ee08a', '#fff'], 40, { speed:200, up:90 });
  toast(`진화! ${WPN[id].name} → ${EVO[id].name}`);
}
function applyChoice(c){
  if (c.type === 'evo') evolve(c.id);
  else if (c.type === 'evoup'){ const w = G.weapons.find(w => w.id === c.id); if (w){ w.evoLv = Math.min(EVO_PLUS_MAX, (w.evoLv || 0) + 1); burst(G.p.x, G.p.y - 14, ['#ffd166', '#ff8fc5', '#fff'], 24, { speed:160 }); } }
  else if (c.type === 'w'){ const w = G.weapons.find(w => w.id === c.id); if (w) w.lvl = Math.min(5, w.lvl + 1); else G.weapons.push(newWeapon(c.id)); }
  else if (c.type === 'p'){ G.passives[c.id] = (G.passives[c.id] || 0) + 1; recalc(); }
  else if (c.type === 'heal') G.p.hp = Math.min(G.p.maxHp, G.p.hp + 40 * healMul());
  else if (c.type === 'coin') G.coins += 10;
}
function bagHtml(hl){

/* ---------- results ---------- */
function showResult(win){
  const st = G.st, H = !!st.hard, clr = H ? meta.hardCleared : meta.cleared, wasCleared = clr[G.stage], bkey = st.id + (H ? '_h' : '');
  const bonus = win ? (st.bonus || 30 * (st.num || G.stage + 1)) : 0, pouch = Math.round(G.coins * (.1 * (meta.up.mcoin || 0) + (G.ch.mods.coin || 0))), earned = G.coins + pouch + bonus;
  meta.coins += earned;
  if (win) clr[G.stage] = true;
  const prev = meta.best[bkey] || 0, newBest = G.time > prev + .5 && !win ? true : false;
  meta.best[bkey] = Math.max(prev, Math.min(G.time, BOSS_AT));
  saveMeta();
  G.result = { win, earned, bonus, pouch, unlock: win && !wasCleared ? (H ? (G.stage < HARD_COUNT - 1 ? '하드 ' + STAGES[NORMAL[G.stage + 1]].name : '') : [...unlocksOf(G.stage), ...(G.stage === LAST_NORMAL && !meta.hardCleared.some(Boolean) ? ['하드 모드'] : [])].join(', ')) : '', newBest };
  state = 'result'; releaseJoy(); keys.clear();
  setScreen('result');
}

/* ---------- camera ---------- */
function camTarget(){

/* ---------- drawing helpers ---------- */
function ell(x, y, rx, ry, rot = 0){ X.beginPath(); X.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }
function fs(fill, lw = 2){ X.fillStyle = fill; X.fill(); X.lineWidth = lw; X.strokeStyle = INK; X.lineJoin = 'round'; X.stroke(); }
function rr(x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function blobs(arr, col, lw = 2.2){
  X.fillStyle = INK; X.beginPath(); for (const [x, y, r] of arr){ X.moveTo(x + r + lw, y); X.arc(x, y, r + lw, 0, TAU); } X.fill();
  X.fillStyle = col; X.beginPath(); for (const [x, y, r] of arr){ X.moveTo(x + r, y); X.arc(x, y, r, 0, TAU); } X.fill();
}
function starPath(x, y, r, pts = 5, inner = .5){
  X.beginPath();
  for (let i = 0; i < pts * 2; i++){ const a = -Math.PI / 2 + i * Math.PI / pts, rr2 = i % 2 ? r * inner : r; const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2; i ? X.lineTo(px, py) : X.moveTo(px, py); }
  X.closePath();
}
function drawStar(x, y, r, fill, lw = 2){ starPath(x, y, r); fs(fill, lw); }
function heartPath(x, y, s){
  X.beginPath(); X.moveTo(x, y + s * .75);
  X.bezierCurveTo(x - s * 1.25, y - s * .1, x - s * .6, y - s * 1.1, x, y - s * .38);
  X.bezierCurveTo(x + s * .6, y - s * 1.1, x + s * 1.25, y - s * .1, x, y + s * .75);
  X.closePath();
}
function glow(x, y, r, col, a){
  const g = X.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,255,255,0)');
  X.globalAlpha = a; X.fillStyle = g; X.beginPath(); X.arc(x, y, r, 0, TAU); X.fill(); X.globalAlpha = 1;
}
function gemShape(s){ X.beginPath(); X.moveTo(0, -s); X.lineTo(s * .85, -s * .2); X.lineTo(0, s); X.lineTo(-s * .85, -s * .2); X.closePath(); }

function drawCookie(){
  ell(0, 0, 15, 15); fs('#e8b06b', 2.4);
  ell(-3, -3, 10, 9); X.fillStyle = '#f2c587'; X.fill();
  X.fillStyle = '#6b3f2a';
  for (const [a, b, r] of [[-6, -5, 2.4], [4, -7, 2], [6, 3, 2.6], [-4, 6, 2.2], [1, 0, 1.8], [-9, 2, 1.6]]){ X.beginPath(); X.arc(a, b, r, 0, TAU); X.fill(); }
}
function drawNote(col){
  X.strokeStyle = INK; X.lineWidth = 2.2; X.lineCap = 'round';
  X.beginPath(); X.moveTo(2, 3); X.lineTo(2, -9); X.quadraticCurveTo(8, -6, 6, -1); X.stroke();

/* ---------- icons (unit box ±20) ---------- */
function drawIcon(id, x, y, s, evo){

function drawIconBase(id, x, y, s){
  X.save(); X.translate(x, y); X.scale(s, s); X.lineCap = 'round'; X.lineJoin = 'round';
  switch (id){
    case 'star': drawStar(0, 1, 17, '#ffd166', 2.4); X.fillStyle = 'rgba(255,255,255,.7)'; ell(-4, -3, 2.6, 1.6, -.6); X.fill(); break;
    case 'petal': for (let i = 0; i < 5; i++){ X.save(); X.rotate(i * TAU / 5); ell(0, -9, 5.5, 9); fs('#ff9fc8', 2); X.restore(); } ell(0, 0, 4.5, 4.5); fs('#ffd166', 2); break;
    case 'bubble': ell(-2, 3, 13, 13); fs('rgba(150,225,255,.8)', 2.2); X.fillStyle = '#fff'; ell(-7, -2, 3.6, 2.2, -.6); X.fill(); ell(11, -11, 5, 5); fs('rgba(150,225,255,.8)', 1.8); break;

      ell(0, -5, 12.5, 6.5); fs('#8a5a3b', 2.2);
      X.fillStyle = 'rgba(255,255,255,.4)'; ell(-4, 4, 2.5, 4, .2); X.fill(); break;
    case 'thunder':
      blobs([[-8, -5, 7], [2, -9, 9], [10, -3, 6.5], [0, -2, 8]], '#ffffff', 2);

function drawAurora(kind, t){

function drawWing(W, side, flap){
  // side: -1 왼쪽, 1 오른쪽. 어깨(±7, -15) 기준으로 그려요
  X.save(); X.translate(side * 7, -15); X.scale(side, 1); X.rotate(-.15 - flap * .25);
  X.lineJoin = 'round'; X.lineCap = 'round';

    const A = [8, -6];
    const TIPS = [[46, -27], [45, -15], [40, -5], [32, 3], [23, 8], [13, 10], [4, 8]];
    const toward = (pt, k) => [pt[0] + (A[0] - pt[0]) * k, pt[1] + (A[1] - pt[1]) * k];
    const notch = (a, b) => toward([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], .3);
    X.beginPath(); X.moveTo(-1, 3); X.bezierCurveTo(1, -16, 20, -30, 40, -32);
    let cur = [40, -32];
    for (let i = 0; i < TIPS.length; i++){
      const tp = TIPS[i], nx = i < TIPS.length - 1 ? notch(tp, TIPS[i + 1]) : [1, 6];
      const c1 = [tp[0] + (tp[0] - A[0]) * .06, tp[1] + (tp[1] - A[1]) * .06];
      X.quadraticCurveTo(c1[0], c1[1], (tp[0] + nx[0]) / 2 + (tp[0] - A[0]) * .03, (tp[1] + nx[1]) / 2 + (tp[1] - A[1]) * .03);

    X.fillStyle = W.fill; X.fill(); X.lineWidth = 2; X.strokeStyle = W.line; X.stroke();
    // 깃털 결
    X.strokeStyle = W.detail; X.lineWidth = 1.4; X.lineCap = 'round';
    for (let i = 0; i < TIPS.length - 1; i++){ const n = notch(TIPS[i], TIPS[i + 1]), e = toward(n, .38); X.beginPath(); X.moveTo(n[0], n[1]); X.quadraticCurveTo((n[0] + e[0]) / 2 + 1.5, (n[1] + e[1]) / 2 - 1.5, e[0], e[1]); X.stroke(); }
  } else if (W.type === 'devil'){
    // 박쥐 날개: 위는 둥글게 솟고, 아래는 손가락 끝 사이가 오목하게 파여요
    const TIPS = [[44, -28], [43, -11], [34, 2], [21, 8], [9, 8]];
    X.beginPath(); X.moveTo(-1, 2); X.bezierCurveTo(4, -14, 22, -26, 44, -28);
    for (let i = 1; i < TIPS.length; i++){
      const a = TIPS[i - 1], b = TIPS[i], m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      X.quadraticCurveTo(m[0] + (6 - m[0]) * .22, m[1] + (-8 - m[1]) * .22, b[0], b[1]);
    }
    X.quadraticCurveTo(4, 5, 0, 6); X.closePath();
    X.fillStyle = W.fill; X.fill(); X.lineWidth = 2.2; X.strokeStyle = INK; X.lineJoin = 'round'; X.stroke();
    // 하얀 갈래 무늬
    X.strokeStyle = W.slit; X.lineWidth = 1.5; X.lineCap = 'round'; X.globalAlpha = .9;
    for (const tp of TIPS.slice(1, 4)){ const s0 = [8 + (tp[0] - 8) * .35, -6 + (tp[1] + 6) * .35], s1 = [8 + (tp[0] - 8) * .72, -6 + (tp[1] + 6) * .72]; X.beginPath(); X.moveTo(s0[0], s0[1]); X.quadraticCurveTo((s0[0] + s1[0]) / 2 + 1.5, (s0[1] + s1[1]) / 2 - 1.5, s1[0], s1[1]); X.stroke(); }
    X.globalAlpha = 1;
  } else {
    X.beginPath(); X.moveTo(0, -2); X.bezierCurveTo(4, -22, 30, -26, 28, -8); X.bezierCurveTo(26, 0, 12, 2, 0, 2); X.closePath();

    X.beginPath(); X.moveTo(0, 2); X.bezierCurveTo(10, 2, 24, 6, 18, 16); X.bezierCurveTo(12, 22, 2, 14, 0, 4); X.closePath();

  }
  X.restore();
}

      X.fillStyle = 'rgba(58,46,95,.18)'; ell(0, 0, 11, 4); X.fill();
      drawBangul(0, 0, 0, .5, 0, false, 1, ch);
      X = prev;
    });
    screenEl.querySelectorAll('.chcard').forEach(b => {
      let armed = false;
      b.addEventListener('click', () => {
        const i = +b.dataset.i, c = CHARS[i]; ensureAudio();
        if (!charUnlocked(c)){
          const msg = b.querySelector('[data-msg]');
          if (meta.coins < c.cost){ msg.textContent = `부족해요 ${meta.coins}/${c.cost}`; msg.className = 'unlock short'; sfx('hurt'); return; }
          if (!armed){ armed = true; msg.textContent = '한 번 더 눌러 해금'; msg.className = 'unlock ask'; sfx('gem'); return; }
          meta.coins -= c.cost; meta.unlockedChars.push(c.id); saveMeta(); sfx('chest');
        } else sfx('buy');
        const keep = screenEl.querySelector('.chars').scrollLeft; selChar = i; save('bangul.sv.char', CHARS[selChar].id); charsScroll = keep; setScreen('chars');
      });
    });
    $('bDone').addEventListener('click', () => setScreen('title'));
    const sel = screenEl.querySelector('.chcard.sel'), row = screenEl.querySelector('.chars');
    if (row){ row.scrollLeft = charsScroll != null ? charsScroll : (sel ? Math.max(0, sel.offsetLeft - row.offsetLeft - row.clientWidth / 2 + sel.clientWidth / 2) : 0); charsScroll = null; }
    if (sel) sel.focus({ preventScroll:true });
  } else if (kind === 'book'){
    const inRun = bookBack === 'pause' && G;
    screenEl.innerHTML = `<div class="panel" style="max-width:820px"><div class="txt">
      <div class="row" style="justify-content:space-between"><h2>진화 도감</h2><button class="big alt" id="bBack">돌아가기</button></div>
      <p class="lead">무기를 Lv.5까지 키우고 짝이 되는 능력을 하나라도 가지고 있으면, 다음 레벨업이나 보물상자에서 진화할 수 있어요. 진화한 뒤 짝 능력을 Lv.5까지 올리면 진화 무기를 +2까지 더 강화할 수 있어요(단계마다 공격력 +25%).</p>
      <div class="book">${Object.keys(EVO).map(id => {
        const e = EVO[id], w = inRun ? G.weapons.find(w => w.id === id) : null, got = w && w.evo;
        const st = !inRun ? '' : got ? '진화 완료' : w ? `지금 Lv.${w.lvl}${G.passives[e.pas] ? ' · 재료 있음' : ''}` : '';
        return `<div class="recipe${got ? ' got' : ''}">
          <div class="formula"><canvas width="60" height="60" data-icon="${id}" aria-hidden="true"></canvas>+<canvas width="60" height="60" data-icon="${e.pas}" aria-hidden="true"></canvas>→<canvas width="60" height="60" data-icon="${id}" data-evo="1" aria-hidden="true"></canvas></div>
          <div><div class="rn">${e.name}</div><div class="hint">${WPN[id].name} Lv.5 + ${PAS[e.pas].name}${st ? ' · ' + st : ''}</div></div>
          <div class="rd">${e.desc}</div></div>`; }).join('')}</div>
    </div></div>`;
    paintIcons(screenEl);
    $('bBack').addEventListener('click', () => setScreen(bookBack));
    $('bBack').focus({ preventScroll:true });
  } else if (kind === 'result'){
    const r = G.result;
    screenEl.innerHTML = `<div class="panel narrow"><div class="txt">
      <p class="eyebrow">${G.st.challenge ? '챌린지 · ' : G.st.hard ? '하드 · ' : ''}${G.st.name}</p>
      <h2>${r.win ? (G.st.challenge ? '챌린지 성공!' : '섬을 지켜냈어요!') : '앗, 쓰러졌어요'}</h2>
      <dl class="stats">
        <dt>버틴 시간</dt><dd>${fmt(G.time)}</dd>
        <dt>레벨</dt><dd>${G.level}</dd>
        <dt>쓰러뜨린 적</dt><dd>${G.kills}</dd>
        <dt>얻은 별사탕</dt><dd>${r.earned}${r.pouch ? `<span class="chip">주머니 +${r.pouch}</span>` : ''}${r.bonus ? `<span class="chip">클리어 +${r.bonus}</span>` : ''}</dd>
      </dl>
      ${r.unlock ? `<p class="lead"><b>${r.unlock}</b> 스테이지가 열렸어요!</p>` : `<p class="lead">${r.win ? '다른 스테이지에도 도전해 보세요.' : '별사탕으로 강화하고 다시 도전해 봐요.'}</p>`}
      <div class="row"><button class="big" id="bRetry">다시 도전</button><button class="big alt" id="bHome">마을로</button></div>
    </div></div>`;
    $('bRetry').addEventListener('click', () => { ensureAudio(); newRun(G.stage); state = 'play'; setScreen(null); });
    $('bHome').addEventListener('click', () => { state = 'title'; setScreen('title'); });
    $('bRetry').focus({ preventScroll:true });
  }
}
function drawHero(rt){
  if (!heroCv || !heroCv.isConnected) return;
  const prev = X; X = heroCv.getContext('2d');
  X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, heroCv.width, heroCv.height);
  X.fillStyle = stageBase().ground; X.beginPath(); X.ellipse(120, 205, 140, 56, 0, 0, TAU); X.fill();
  X.setTransform(1, 0, 0, 1, 0, 0);
  const ch = CHARS[selChar];
  // the character's starting weapon orbits around it
  for (let i = 0; i < 3; i++){
    const a = rt * 1.3 + i * TAU / 3;
    drawIcon(ch.start2 && i === 1 ? ch.start2 : ch.start, 120 + Math.cos(a) * 84, 132 + Math.sin(a) * 36, .7);
  }
  X.setTransform(4, 0, 0, 4, 120, 186);
  X.fillStyle = 'rgba(58,46,95,.18)'; ell(0, 0, 11, 4); X.fill();
  drawDressedChar(0, 0, Math.sin(rt * .8) * .6, .5, rt * .5, false, rt, ch);
  X = prev;
}

/* ---------- loop ---------- */
let last = performance.now(), dashCool = false;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const rt = now / 1000;
  if (G){
    if (state === 'play'){
      const sim = dt * gameSpeed, n = Math.max(1, Math.ceil(sim / (1 / 40))), h = sim / n;
      for (let i = 0; i < n && state === 'play'; i++) update(h);
    }
    else if (state === 'dying'){ G.dieT -= dt; updateFx(dt); if (G.dieT <= 0) showResult(false); }
    if (state !== 'title' && state !== 'shop'){
      const [cx, cy] = camTarget(), k = Math.min(1, dt * 8);
      G.cam.x += (cx - G.cam.x) * k; G.cam.y += (cy - G.cam.y) * k;
    }
    const cool = G.p.dashCd > 0;
    if (cool !== dashCool){ dashCool = cool; btnDash.classList.toggle('cool', cool); }
  }
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
  render(rt);
  drawHero(rt);
  drawCosPrev(rt);
  requestAnimationFrame(frame);
}

/* ---------- layout ---------- */
function readSafe(){
  const cs = getComputedStyle($('safeProbe'));
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
}
function checkRotate(){
  const coarse = matchMedia('(pointer: coarse)').matches, portrait = innerHeight > innerWidth, o = settings.orient;
  const wrong = (o === 'landscape' && portrait) || (o === 'portrait' && !portrait);
  const show = coarse && wrong && !rotateDismissed;
  if (show){
    const land = o === 'landscape';
    $('rotTitle').textContent = land ? '휴대폰을 가로로 돌려 주세요' : '휴대폰을 세로로 돌려 주세요';
    $('rotLead').textContent = (land ? '가로 모드' : '세로 모드') + '로 설정되어 있어요. 화면 방향은 설정에서 바꿀 수 있어요.';
  }
  $('rotate').hidden = !show;
}
function applyOrientation(){
  try {
    const so = screen.orientation;
    if (so){
      if (settings.orient === 'auto'){ if (so.unlock) so.unlock(); }
      else if (so.lock) so.lock(settings.orient).catch(() => {});
    }
  } catch(e){}
  rotateDismissed = false; checkRotate();
}
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  vw = innerWidth; vh = innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  zoom = Math.max(.6, Math.min(2.6, Math.max(.85, Math.min(2.2, Math.min(vh / (T * 12.5), vw / (T * 14)))) * (settings.view || 1)));
  readSafe(); checkRotate();
}
addEventListener('resize', resize);

function start(){
  resize(); applyOrientation();
  state = 'title'; setScreen('title');
  requestAnimationFrame(frame);
}
const hot = window.claude?.hot;
if (hot && hot.ready) hot.ready(start); else start();
})();
</script>
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
